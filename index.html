<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Подарки, подарочки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore-compat.js"></script>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f110d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Подарки">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));</script>
  <style>
    :root{
      --bg:#0f110d; --s1:#181c15; --s2:#1f2419; --s3:#262c1f;
      --b1:rgba(255,255,255,0.07); --b2:rgba(255,255,255,0.13);
      --t1:#f0ece4; --t2:#8a9080;
      --g1:#5a7a38; --g2:#7ea858; --gold:#c8a96e; --red:#e07060;
      --nav-h:66px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{background:var(--bg);}
    body{font-family:'Golos Text',sans-serif;color:var(--t1);margin:0;overflow-x:hidden;overscroll-behavior:none;}
    button{font-family:inherit;}
    a{color:inherit;}

    .mesh-bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
    .mesh-bg::before{content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse 70% 50% at 10% 15%,color-mix(in srgb,var(--g1) 28%,transparent) 0%,transparent 60%),
                 radial-gradient(ellipse 50% 60% at 90% 85%,rgba(140,95,40,0.16) 0%,transparent 60%);
      animation:meshMove 14s ease-in-out infinite alternate;}
    @keyframes meshMove{0%{opacity:1;transform:scale(1)}100%{opacity:.75;transform:scale(1.06)}}
    .bg-photo{position:fixed;inset:0;z-index:-1;background-image:url('E3888A90-B1B8-4628-B6F1-032D4C9FFF50.png');background-size:cover;background-position:center;opacity:.05;}
    .snow-canvas,.fx-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}
    .snow-canvas{z-index:0;}
    .fx-canvas{z-index:1000;}

    .app{position:relative;z-index:1;max-width:520px;margin:0 auto;}
    .screen{padding:0 16px;padding-bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px));}
    .page-header{padding:calc(20px + env(safe-area-inset-top,0px)) 0 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
    .page-title{font-family:'Unbounded',sans-serif;font-size:clamp(1.25rem,5.4vw,1.65rem);font-weight:900;line-height:1.08;
      background:linear-gradient(135deg,color-mix(in srgb,var(--g2) 70%,white),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .grad-text{background:linear-gradient(135deg,var(--g2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

    /* Bottom nav */
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
      background:rgba(20,24,18,0.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      border-top:1px solid var(--b2);display:flex;z-index:100;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative;user-select:none;}
    .nav-item:active .nav-icon{transform:scale(.85);}
    .nav-icon{font-size:22px;line-height:1;transition:transform .25s cubic-bezier(.3,1.6,.5,1);filter:grayscale(.6);opacity:.75;}
    .nav-item.on .nav-icon{transform:translateY(-2px) scale(1.15);filter:none;opacity:1;}
    .nav-label{font-size:10px;font-weight:600;color:var(--t2);letter-spacing:.02em;transition:color .2s;}
    .nav-item.on .nav-label{color:var(--g2);}
    .nav-badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--red);color:white;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg);}

    .card{background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:16px;}
    .card+.card{margin-top:10px;}
    .glass{background:rgba(255,255,255,.035);border:1px solid var(--b1);border-radius:16px;}

    .inp,.txta{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:14px;padding:12px 14px;color:var(--t1);font-family:'Golos Text',sans-serif;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s;}
    .inp::placeholder,.txta::placeholder{color:var(--t2);}
    .inp:focus,.txta:focus{border-color:var(--g2);box-shadow:0 0 0 3px color-mix(in srgb,var(--g2) 22%,transparent);}
    .txta{resize:none;}
    select{background:var(--s2);border:1px solid var(--b2);border-radius:12px;color:var(--t1);padding:8px 10px;font-family:'Golos Text',sans-serif;font-size:13px;outline:none;}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:transform .15s,box-shadow .2s,opacity .2s;white-space:nowrap;}
    .btn:active{transform:scale(.95);}
    .btn-p{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 4px 18px color-mix(in srgb,var(--g1) 45%,transparent);}
    .btn-p:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
    .btn-gold{background:linear-gradient(135deg,#9a7a40,var(--gold));color:#1a1408;box-shadow:0 4px 18px rgba(200,169,110,.3);}
    .btn-g{background:var(--s2);color:var(--t1);border:1px solid var(--b2);}
    .btn-g:disabled{opacity:.4;}
    .btn-d{background:rgba(200,80,60,.1);color:var(--red);border:1px solid rgba(200,80,60,.22);}
    .btn-sm{font-size:12px;padding:7px 13px;}
    .btn-block{width:100%;}
    .icon-btn{width:38px;height:38px;border-radius:12px;background:var(--s1);border:1px solid var(--b2);color:var(--t1);display:inline-flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;}
    .icon-btn:active{transform:scale(.92);}

    .badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:600;white-space:nowrap;}
    .b-green{background:color-mix(in srgb,var(--g2) 14%,transparent);color:var(--g2);border:1px solid color-mix(in srgb,var(--g2) 30%,transparent);}
    .b-gold{background:rgba(200,169,110,.14);color:var(--gold);border:1px solid rgba(200,169,110,.3);}
    .b-red{background:rgba(224,112,96,.13);color:#f08a78;border:1px solid rgba(224,112,96,.3);}
    .b-muted{background:var(--s2);color:var(--t2);border:1px solid var(--b2);}

    .err{color:#e88878;font-size:13px;line-height:1.4;}
    .note{color:var(--t2);font-size:13px;line-height:1.45;}
    .sec{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);margin:18px 0 10px;}
    .divider{height:1px;background:var(--b1);margin:12px 0;}
    .row{display:flex;align-items:center;gap:8px;}
    .hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;}
    .hscroll::-webkit-scrollbar{display:none;}

    .chip{flex-shrink:0;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;border:1px solid var(--b2);cursor:pointer;background:var(--s2);color:var(--t2);display:inline-flex;align-items:center;gap:6px;transition:all .2s;}
    .chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent;box-shadow:0 3px 12px color-mix(in srgb,var(--g1) 40%,transparent);}

    .avatar{display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:700;color:white;flex-shrink:0;overflow:hidden;}
    .avatar img{width:100%;height:100%;object-fit:cover;}

    /* Events */
    .event-card{flex-shrink:0;min-width:128px;border-radius:18px;padding:12px 14px;background:var(--s1);border:1px solid var(--b1);}
    .event-card.hero{min-width:200px;background:linear-gradient(135deg,color-mix(in srgb,var(--g1) 55%,var(--s1)),color-mix(in srgb,var(--gold) 30%,var(--s1)));border-color:color-mix(in srgb,var(--gold) 35%,transparent);}
    .event-num{font-family:'Unbounded',sans-serif;font-weight:900;font-size:26px;line-height:1;}

    /* People grid */
    .people-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .person-tile{background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;cursor:pointer;transition:transform .2s,border-color .2s;position:relative;animation:pop .4s cubic-bezier(.3,1.5,.5,1) both;}
    .person-tile:active{transform:scale(.96);}
    .person-tile .flag{position:absolute;top:10px;right:10px;}
    @keyframes pop{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:none}}

    .santa{border-radius:20px;padding:14px 16px;background:linear-gradient(135deg,rgba(200,80,60,.14),rgba(200,169,110,.1));border:1px solid rgba(200,120,80,.25);display:flex;align-items:center;gap:14px;}
    .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;}
    .bar>div{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g2),var(--gold));transition:width .8s cubic-bezier(.3,1.2,.5,1);}

    /* Wish cards */
    .wish-card{background:var(--s1);border:1px solid var(--b1);border-radius:20px;overflow:hidden;transition:opacity .3s,border-color .3s;animation:fadeUp .35s cubic-bezier(.22,.68,0,1.2) both;}
    .wish-card+.wish-card{margin-top:10px;}
    .wish-card.claimed{opacity:.5;}
    .wish-card.mine-claim{border-color:color-mix(in srgb,var(--g2) 45%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--g2) 15%,transparent),0 8px 30px color-mix(in srgb,var(--g1) 18%,transparent);}
    .wish-img{width:100%;aspect-ratio:16/10;background:var(--s2);cursor:zoom-in;overflow:hidden;}
    .wish-img img{width:100%;height:100%;object-fit:cover;display:block;}
    .wish-body{padding:13px 14px 4px;}
    .wish-title{font-weight:700;font-size:16px;line-height:1.3;margin-bottom:6px;word-break:break-word;}
    .wish-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
    .wish-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:6px 14px 13px;flex-wrap:wrap;}
    .owner-tag{display:flex;align-items:center;gap:8px;padding:11px 14px 0;font-size:12px;font-weight:700;color:var(--gold);}
    .shop-chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px 3px 4px;font-size:11px;font-weight:600;background:var(--s2);border:1px solid var(--b2);text-decoration:none;color:var(--t1);max-width:100%;}
    .shop-chip img{width:16px;height:16px;border-radius:5px;background:white;}
    .warn{font-size:12px;color:var(--gold);background:rgba(200,169,110,.08);border-radius:10px;padding:6px 10px;margin:6px 0;}

    .fab{position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50vw - 244px));width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;font-size:28px;color:white;box-shadow:0 8px 24px color-mix(in srgb,var(--g1) 55%,transparent);cursor:pointer;z-index:90;border:none;transition:transform .25s cubic-bezier(.3,1.6,.5,1);}
    .fab:active{transform:scale(.9) rotate(90deg);}

    .person-overlay{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .35s cubic-bezier(.22,.68,0,1.05);visibility:hidden;}
    .person-overlay.open{transform:translateX(0);visibility:visible;}

    .modal-bg{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
    .modal-bg.open{opacity:1;pointer-events:all;}
    .modal-sheet{background:var(--s1);border:1px solid var(--b2);border-bottom:none;border-radius:26px 26px 0 0;padding:14px 20px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;transform:translateY(100%);transition:transform .35s cubic-bezier(.22,.68,0,1.05);max-height:92vh;overflow-y:auto;}
    .modal-bg.open .modal-sheet{transform:translateY(0);}
    .modal-handle{width:38px;height:4px;border-radius:2px;background:var(--b2);margin:0 auto 16px;}
    .sheet-title{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;margin-bottom:16px;}

    .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
    .seg button{border-radius:14px;padding:10px 6px;background:var(--s2);border:1px solid var(--b2);color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .2s;}
    .seg button .e{font-size:20px;transition:transform .25s cubic-bezier(.3,1.6,.5,1);}
    .seg button.on{color:var(--t1);border-color:var(--g2);background:color-mix(in srgb,var(--g2) 14%,var(--s2));}
    .seg button.on .e{transform:scale(1.25);}

    .img-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;}

    /* Status stepper */
    .steps{display:flex;gap:4px;margin-top:10px;}
    .step{flex:1;border:none;border-radius:10px;padding:7px 2px 6px;background:var(--s2);color:var(--t2);font-size:10px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .25s;}
    .step .e{font-size:16px;filter:grayscale(1);opacity:.5;transition:all .3s cubic-bezier(.3,1.6,.5,1);}
    .step.done{background:color-mix(in srgb,var(--g2) 16%,var(--s2));color:var(--t1);}
    .step.done .e{filter:none;opacity:1;}
    .step.cur .e{transform:scale(1.25);}

    .toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:900;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px;}
    .toast{background:rgba(30,36,26,.96);border:1px solid var(--b2);border-radius:16px;padding:11px 16px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.45);animation:toastIn .45s cubic-bezier(.3,1.5,.5,1) both;}
    .toast span{font-size:20px;}
    @keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.9)}to{opacity:1;transform:none}}

    .switch{width:46px;height:28px;border-radius:14px;background:var(--s2);border:1px solid var(--b2);position:relative;cursor:pointer;flex-shrink:0;transition:background .2s;}
    .switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--t2);transition:all .25s cubic-bezier(.3,1.5,.5,1);}
    .switch.on{background:var(--g1);}
    .switch.on::after{left:21px;background:white;}

    .empty{text-align:center;padding:40px 16px;}
    .empty .big{font-size:52px;margin-bottom:12px;animation:float 3s ease-in-out infinite;}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .fu{animation:fadeUp .3s cubic-bezier(.22,.68,0,1.2) both;}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
  </style>
</head>
<body>
<div class="bg-photo"></div>
<div class="mesh-bg"></div>
<div id="root"></div>

<script type="text/babel">
  const { useEffect, useState, useMemo, useRef } = React;

  // ══════════════════════════════════════
  // FIREBASE
  // ══════════════════════════════════════
  const firebaseConfig = {
    apiKey:"AIzaSyC26Xjjr0pFQDVFtCgRyteEpNEjngVOJFI",
    authDomain:"wishlist-37819.firebaseapp.com",
    projectId:"wishlist-37819",
    storageBucket:"wishlist-37819.firebasestorage.app",
    messagingSenderId:"72495355387",
    appId:"1:72495355387:web:0ff709125d3cf33c8c275e"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const FV = firebase.firestore.FieldValue;
  auth.signInAnonymously().catch(console.error);

  // Старый семейный список становится первой «группой» — все данные сохраняются
  const LEGACY_LIST = 'newyear2025';
  const listsCol    = () => db.collection('lists');
  const usersCol    = () => db.collection('users');
  const profilesCol = () => db.collection('profiles');
  const itemsCol    = gid => listsCol().doc(gid).collection('items');
  const claimsCol   = gid => listsCol().doc(gid).collection('claims');

  // ══════════════════════════════════════
  // UTILS
  // ══════════════════════════════════════
  const saveLocal = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} };
  const loadLocal = (k,fb) => { try{ const v=localStorage.getItem(k); return v!=null?JSON.parse(v):fb; }catch{ return fb; } };
  const cleanName = s => (s||'').replace(/\//g,'').replace(/\s+/g,' ').trim();

  function compressImage(file, max=800, quality=.72) {
    return new Promise((res,rej) => {
      const r = new FileReader();
      r.onload = e => {
        const img = new Image();
        img.onload = () => {
          const s = Math.min(max/img.width, max/img.height, 1);
          const c = document.createElement('canvas');
          c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          const d = c.toDataURL('image/jpeg',quality);
          if(d.length>900000){ rej('Картинка слишком большая.'); return; }
          res(d);
        };
        img.onerror = () => rej('Не удалось прочитать картинку.');
        img.src = e.target.result;
      };
      r.onerror = () => rej('Ошибка файла.');
      r.readAsDataURL(file);
    });
  }

  async function hashPin(pin) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin+'podarki_salt'));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  const plural = (n,[one,few,many]) => {
    const a=Math.abs(n)%100, b=a%10;
    if(a>10&&a<20) return many;
    if(b===1) return one;
    if(b>=2&&b<=4) return few;
    return many;
  };
  const fmtPrice = n => n ? new Intl.NumberFormat('ru-RU').format(Math.round(n))+' ₽' : '';
  const normUrl = u => { u=(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; return u; };
  const hostOf = u => { try{ return new URL(normUrl(u)).hostname.replace(/^www\./,''); }catch{ return ''; } };
  const SHOPS = [
    [/ozon\./,'Ozon'], [/wildberries|(^|\.)wb\.ru/,'Wildberries'], [/market\.yandex|yandex\.ru\/market/,'Я.Маркет'],
    [/aliexpress/,'AliExpress'], [/amazon\./,'Amazon'], [/lamoda/,'Lamoda'], [/goldapple/,'Золотое Яблоко'],
    [/letu\./,'Л’Этуаль'], [/mvideo/,'М.Видео'], [/dns-shop/,'DNS'], [/megamarket/,'Мегамаркет'], [/detmir/,'Детский мир'],
    [/litres/,'Литрес'], [/labirint/,'Лабиринт'], [/chitai-gorod/,'Читай-город'], [/avito/,'Авито'], [/ikea|swed-house|hoff/,'Для дома'],

  function shopOf(u) {

  const genCode = () => Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');

  const NAME_COLORS = [
    ['#5a7a38','#7ea858'],['#8a6a30','#c8a96e'],['#3a6050','#5a9070'],['#7a5030','#b87840'],

  const nameColor = name => NAME_COLORS[(name||'?').split('').reduce((a,c)=>a+c.charCodeAt(0),0) % NAME_COLORS.length];

  // Дни до ближайшей даты MM-DD (0 = сегодня)
  function daysUntil(mmdd) {
    if(!mmdd) return null;
    const now = new Date(); const today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const [m,d] = mmdd.split('-').map(Number); if(!m||!d) return null;
    let t = new Date(today.getFullYear(),m-1,d);
    if(t<today) t = new Date(today.getFullYear()+1,m-1,d);
    return Math.round((t-today)/864e5);
  }
  const whenText = n => n===0 ? 'сегодня!' : n===1 ? 'завтра' : `через ${n} ${plural(n,['день','дня','дней'])}`;
  const HOLIDAYS = [

  const isClaimBy = (c,name) => !!c && (c.claimerName===name || (c.participants||[]).includes(name));

  // ══════════════════════════════════════
  // FX: конфетти, тосты, подтверждения
  // ══════════════════════════════════════
  const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FX = (() => {
    let cv, ctx, parts=[], raf=null;
    const resize = () => { const d=window.devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; ctx.setTransform(d,0,0,d,0,0); };
    const ensure = () => { if(cv) return; cv=document.createElement('canvas'); cv.className='fx-canvas'; document.body.appendChild(cv); ctx=cv.getContext('2d'); resize(); addEventListener('resize',resize); };
    const loop = () => {
      ctx.clearRect(0,0,innerWidth,innerHeight);
      parts = parts.filter(p=>p.life>0);
      for(const p of parts){
        p.vy+=p.g; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--;
        ctx.save(); ctx.globalAlpha=Math.min(1,p.life/25); ctx.translate(p.x,p.y); ctx.rotate(p.r);
        if(p.emoji){ ctx.font=p.size+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.emoji,0,0); }
        else { ctx.fillStyle=p.c; ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2); }
        ctx.restore();
      }
      raf = parts.length ? requestAnimationFrame(loop) : null;
    };
    function burst({x=innerWidth/2,y=innerHeight/2,n=50,emoji=null,spread=1,power=1}={}) {
      if(reduceMotion()) return; ensure();
      const colors=['#7ea858','#c8a96e','#f0ece4','#e07060','#5a9070','#ffd36e','#b05a78'];
      for(let i=0;i<n;i++){
        const a=-Math.PI/2+(Math.random()-.5)*Math.PI*spread, s=(3+Math.random()*7)*power;
        parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.2,r:Math.random()*6,vr:(Math.random()-.5)*.3,
          life:60+Math.random()*50,size:emoji?16+Math.random()*12:6+Math.random()*6,c:colors[i%colors.length],
          emoji:emoji?(Array.isArray(emoji)?emoji[i%emoji.length]:emoji):null});
      }
      if(!raf) raf=requestAnimationFrame(loop);
    }
    function big(){
      burst({x:innerWidth*.15,y:innerHeight*.75,n:70,spread:.7,power:1.4});
      burst({x:innerWidth*.85,y:innerHeight*.75,n:70,spread:.7,power:1.4});
      setTimeout(()=>burst({y:innerHeight*.45,n:24,emoji:['🎁','✨','🎄','⭐','🎀']}),220);
    }
    return { burst, big };
  })();
  const burstFrom = (el, opts={}) => {
    const r = el && el.getBoundingClientRect ? el.getBoundingClientRect() : null;
    FX.burst({ ...(r?{x:r.left+r.width/2,y:r.top+r.height/2}:{}), ...opts });
  };

  const toast = (text, e='✨') => window.dispatchEvent(new CustomEvent('app:toast',{detail:{text,e,id:Math.random()}}));
  function ToastHost(){

      addEventListener('app:toast',h); return ()=>removeEventListener('app:toast',h);
    },[]);
    return <div className="toasts">{list.map(t=><div key={t.id} className="toast"><span>{t.e}</span>{t.text}</div>)}</div>;
  }

  let confirmImpl = null;

  function ConfirmHost(){

  // ══════════════════════════════════════
  // SNOW
  // ══════════════════════════════════════
  function Snow() {
    const ref = useRef(null);
    useEffect(()=>{
      if(reduceMotion()) return;
      const cv=ref.current, ctx=cv.getContext('2d'); let raf, W, H;
      const resize=()=>{ const d=window.devicePixelRatio||1; W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0); };
      resize(); addEventListener('resize',resize);
      const flakes = Array.from({length:55},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.8+Math.random()*2.2,s:.3+Math.random()*.9,w:Math.random()*Math.PI*2}));
      const tick=()=>{
        ctx.clearRect(0,0,W,H); ctx.fillStyle='rgba(255,255,255,.55)';
        for(const f of flakes){ f.y+=f.s; f.w+=.01; f.x+=Math.sin(f.w)*.4; if(f.y>H+5){f.y=-5;f.x=Math.random()*W;}
          ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill(); }
        raf=requestAnimationFrame(tick);
      };
      tick();
      return ()=>{ cancelAnimationFrame(raf); removeEventListener('resize',resize); };
    },[]);
    return <canvas ref={ref} className="snow-canvas"/>;
  }

  function AuthScreen({ onAuth, invite }) {
    const [step,setStep] = useState('name');
    const [nameInput,setNameInput] = useState('');
    const [pin,setPin] = useState('');
    const [pin2,setPin2] = useState('');
    const [loading,setLoading] = useState(false);
    const [error,setError] = useState('');
    const name = cleanName(nameInput);

    const permErr = () => setError('Нет доступа к базе. Обновите правила Firestore (файл firestore.rules).');

    const handleName = async () => {
      if(!name) return;
      setLoading(true); setError('');
      try {
        if(!auth.currentUser) await auth.signInAnonymously();
        const doc = await usersCol().doc(name).get();
        setStep(doc.exists ? 'pin_enter' : 'pin_new');
      } catch(e) {
        console.error(e);
        e.code==='permission-denied' ? permErr() : setError('Ошибка соединения. Проверьте интернет.');
      }
      setLoading(false);
    };

    const handleRegister = async () => {
      if(pin.length<4){ setError('PIN минимум 4 цифры.'); return; }
      if(pin!==pin2){ setError('PIN-коды не совпадают.'); return; }
      setLoading(true); setError('');
      try {
        const hashed = await hashPin(pin);
        const ref = usersCol().doc(name);
        await db.runTransaction(async tx => {
          const snap = await tx.get(ref);
          if(snap.exists) throw new Error('taken');
          tx.set(ref,{ pinHash:hashed, createdAt:Date.now(), groups: invite?[invite.id]:[] });
        });
        saveLocal('nywish:name',name); saveLocal('nywish:pin_ok',name);
        onAuth(name, true);
      } catch(e) {
        console.error(e);
        if(e.message==='taken'){ setError('Это имя уже занято. Введите PIN.'); setStep('pin_enter'); setPin(''); setPin2(''); }
        else if(e.code==='permission-denied') permErr();
        else setError('Не удалось зарегистрироваться. Попробуйте ещё раз.');
      }
      setLoading(false);
    };

    const handleLogin = async () => {
      if(!pin) return;
      setLoading(true); setError('');
      try {
        const doc = await usersCol().doc(name).get();
        if(!doc.exists){ setError('Профиль не найден.'); setLoading(false); return; }
        if(doc.data().pinHash !== await hashPin(pin)){ setError('Неверный PIN. Попробуйте ещё раз.'); setPin(''); vibrate([40,40,40]); setLoading(false); return; }
        saveLocal('nywish:name',name); saveLocal('nywish:pin_ok',name);
        onAuth(name, false);
      } catch(e) {
        console.error(e);
        e.code==='permission-denied' ? permErr() : setError('Ошибка соединения. Проверьте интернет.');
      }
      setLoading(false);
    };

    return (
      <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'24px 20px',position:'relative',zIndex:1}}>
        <div style={{width:'100%',maxWidth:370}}>
          <div style={{textAlign:'center',marginBottom:28}}>
            <div className="empty" style={{padding:0}}><div className="big" style={{fontSize:60}}>🎁</div></div>
            <div className="page-title" style={{fontSize:26}}>Подарки,<br/>подарочки</div>
            <div className="note" style={{marginTop:10}}>Вишлисты для своих — без повторов и испорченных сюрпризов</div>
          </div>

          {invite && (
            <div className="glass fu" style={{padding:'12px 14px',marginBottom:12,display:'flex',gap:12,alignItems:'center',borderColor:'rgba(200,169,110,.35)'}}>
              <div style={{fontSize:28}}>{invite.emoji||'🎄'}</div>
              <div><div style={{fontWeight:700}}>Вас пригласили в «{invite.name}»</div>
                <div className="note" style={{fontSize:12}}>Войдите или создайте профиль — и вы в группе</div></div>
            </div>
          )}

          <div className="card">
            {step==='name' && (<>
              <div className="sec" style={{marginTop:0}}>Как вас зовут?</div>
              <input className="inp" placeholder="Имя (Ира, Валера…)" value={nameInput} maxLength={30}
                onChange={e=>{setNameInput(e.target.value);setError('');}}
                onKeyDown={e=>e.key==='Enter'&&name&&handleName()} style={{marginBottom:10}} autoFocus/>
              {error&&<div className="err" style={{marginBottom:8}}>{error}</div>}
              <button className="btn btn-p btn-block" onClick={handleName} disabled={!name||loading}>{loading?'Проверяем…':'Продолжить →'}</button>
            </>)}

            {step==='pin_new' && (<>
              <div className="sec" style={{marginTop:0}}>Придумайте PIN</div>
              <div className="note" style={{marginBottom:12}}>Имя <b style={{color:'var(--t1)'}}>{name}</b> свободно! PIN защитит профиль — с ним можно входить с любого устройства.</div>
              <input className="inp" type="password" inputMode="numeric" placeholder="PIN (мин. 4 цифры)" value={pin}
                onChange={e=>{setPin(e.target.value.replace(/\D/g,''));setError('');}} maxLength={8} style={{marginBottom:8}} autoFocus/>
              <input className="inp" type="password" inputMode="numeric" placeholder="Повторите PIN" value={pin2}
                onChange={e=>{setPin2(e.target.value.replace(/\D/g,''));setError('');}} maxLength={8} style={{marginBottom:10}}
                onKeyDown={e=>e.key==='Enter'&&handleRegister()}/>
              {error&&<div className="err" style={{marginBottom:8}}>{error}</div>}
              <div className="row">
                <button className="btn btn-g" style={{flex:1}} onClick={()=>{setStep('name');setPin('');setPin2('');setError('');}}>←</button>
                <button className="btn btn-p" style={{flex:3}} onClick={handleRegister} disabled={pin.length<4||!pin2||loading}>{loading?'Создаём…':'Создать профиль ✓'}</button>
              </div>
            </>)}

            {step==='pin_enter' && (<>
              <div className="sec" style={{marginTop:0}}>Введите PIN</div>
              <div className="note" style={{marginBottom:12}}>Привет, <b style={{color:'var(--t1)'}}>{name}</b>! 👋</div>
              <input className="inp" type="password" inputMode="numeric" placeholder="Ваш PIN" value={pin}
                onChange={e=>{setPin(e.target.value.replace(/\D/g,''));setError('');}} maxLength={8} style={{marginBottom:10}}
                onKeyDown={e=>e.key==='Enter'&&handleLogin()} autoFocus/>
              {error&&<div className="err" style={{marginBottom:8}}>{error}</div>}
              <div className="row">
                <button className="btn btn-g" style={{flex:1}} onClick={()=>{setStep('name');setPin('');setError('');}}>←</button>
                <button className="btn btn-p" style={{flex:3}} onClick={handleLogin} disabled={!pin||loading}>{loading?'Проверяем…':'Войти →'}</button>
              </div>
            </>)}
          </div>
        </div>
      </div>
    );
  }

  // ══════════════════════════════════════
  const BLANK = { title:'', url:'', price:'', priority:2, note:'', image:'' };
  function WishSheet({ open, initial, onClose, onSave }) {
    const [f,setF] = useState(BLANK);
    const [imgErr,setImgErr] = useState('');
    const [imgLoad,setImgLoad] = useState(false);
    const titleRef = useRef(null);
    const set = (k,v) => setF(p=>({...p,[k]:v}));

    useEffect(()=>{
      if(!open) return;
      setF(initial ? { ...BLANK, ...initial, price: initial.price?String(initial.price):'', image: initial.image||'', priority: initial.priority||2 } : BLANK);
      setImgErr('');
      if(!initial) setTimeout(()=>titleRef.current && titleRef.current.focus(), 350);
    },[open, initial && initial.id]);

    const handleFile = async e => {
      const file = e.target.files && e.target.files[0]; if(!file) return;
      setImgLoad(true); setImgErr('');
      try{ set('image', await compressImage(file)); }catch(err){ setImgErr(typeof err==='string'?err:'Ошибка.'); }
      finally{ setImgLoad(false); e.target.value=''; }
    };
    const shop = shopOf(f.url);
    const submit = e => {
      if(!f.title.trim()) return;
      onSave({ title:f.title.trim(), url:normUrl(f.url), note:f.note.trim(), image:f.image||null,
        price: Number(String(f.price).replace(/[^\d]/g,''))||null, priority:f.priority }, e.currentTarget);
    };

    return (
      <Sheet open={open} onClose={onClose}>
        <div className="sheet-title">{initial?'Редактировать ✏️':'Новое желание ✨'}</div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <input ref={titleRef} className="inp" placeholder="Что хочется получить?" value={f.title} maxLength={120} onChange={e=>set('title',e.target.value)}/>
          <div style={{position:'relative'}}>
            <input className="inp" placeholder="Ссылка на товар (необязательно)" value={f.url} onChange={e=>set('url',e.target.value)} inputMode="url" style={shop?{paddingRight:120}:null}/>
            {shop && <span className="shop-chip" style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',maxWidth:110}}><img src={shop.icon} alt=""/>{shop.name}</span>}
          </div>
          <div className="row">
            <input className="inp" placeholder="Примерная цена, ₽" value={f.price} inputMode="numeric" onChange={e=>set('price',e.target.value.replace(/[^\d\s]/g,''))}/>
          </div>
          <div className="seg">
            {PRIORITIES.map(p=>(
              <button key={p.v} className={f.priority===p.v?'on':''} onClick={()=>{set('priority',p.v);vibrate(10);}}>
                <span className="e">{p.e}</span>{p.label}
              </button>
            ))}
          </div>
          <textarea className="txta" rows="2" placeholder="Цвет, размер, нюансы…" value={f.note} onChange={e=>set('note',e.target.value)}/>
          {f.image && !imgLoad ? (
            <div style={{position:'relative'}}>
              <img src={f.image} alt="" style={{borderRadius:14,maxHeight:160,width:'100%',objectFit:'cover',display:'block'}}/>
              <button className="icon-btn" style={{position:'absolute',top:8,right:8,width:32,height:32}} onClick={()=>set('image','')}>✕</button>
            </div>
          ) : (
            <label className="btn btn-g" style={{cursor:'pointer'}}>
              {imgLoad?'Сжимаем…':'📷 Добавить фото'}
              <input type="file" accept="image/*" style={{display:'none'}} onChange={handleFile}/>
            </label>
          )}
          {imgErr && <div className="err">{imgErr}</div>}
          <div className="row" style={{marginTop:4}}>
            <button className="btn btn-g" style={{flex:1}} onClick={onClose}>Отмена</button>
            <button className="btn btn-p" style={{flex:2}} onClick={submit} disabled={!f.title.trim()||imgLoad}>{initial?'Сохранить ✓':'Добавить ✓'}</button>
          </div>
        </div>
      </Sheet>
    );
  }

  const GROUP_EMOJI = ['🎄','🏡','👨‍👩‍👧','🎂','💼','🧑‍🤝‍🧑','❤️','🌟'];
  function inviteLink(g){ return `${location.origin}${location.pathname}?join=${g.code}`; }
  async function shareInvite(g){
    const url = inviteLink(g);
    const text = `Присоединяйся к вишлисту «${g.name}» 🎁 Код: ${g.code}`;
    try {
      if(navigator.share){ await navigator.share({ title:'Подарки, подарочки', text, url }); return; }
      await navigator.clipboard.writeText(`${text}\n${url}`); toast('Ссылка-приглашение скопирована','🔗');
    } catch(e) { if(e && e.name!=='AbortError'){ prompt('Скопируйте ссылку:', url); } }
  }

  function GroupCreateJoin({ onCreate, onJoin, compact }) {
    const [mode,setMode] = useState(null);
    const [name,setName] = useState(''); const [emoji,setEmoji] = useState('🎄');
    const [code,setCode] = useState(''); const [busy,setBusy] = useState(false); const [err,setErr] = useState('');
    const run = async fn => { setBusy(true); setErr(''); try{ await fn(); setMode(null); setName(''); setCode(''); }catch(e){ console.error(e); setErr(e.message==='not-found'?'Группа с таким кодом не найдена.':e.code==='permission-denied'?'Нет доступа — обновите правила Firestore.':'Не получилось. Попробуйте ещё раз.'); } setBusy(false); };
    return (
      <div>
        {!mode && (
          <div className="row">
            <button className="btn btn-g btn-sm" style={{flex:1}} onClick={()=>setMode('create')}>＋ Новая группа</button>
            <button className="btn btn-g btn-sm" style={{flex:1}} onClick={()=>setMode('join')}>🔑 Ввести код</button>
          </div>
        )}
        {mode==='create' && (
          <div style={{display:'flex',flexDirection:'column',gap:8}} className="fu">
            <div className="hscroll" style={{margin:0,padding:0}}>
              {GROUP_EMOJI.map(e=><button key={e} className={`chip ${emoji===e?'on':''}`} style={{fontSize:18,padding:'5px 10px'}} onClick={()=>setEmoji(e)}>{e}</button>)}
            </div>
            <input className="inp" placeholder="Название: Семья, Друзья, Офис…" value={name} maxLength={40} onChange={e=>setName(e.target.value)} autoFocus={!compact}/>
            {err && <div className="err">{err}</div>}
            <div className="row">
              <button className="btn btn-g btn-sm" style={{flex:1}} onClick={()=>{setMode(null);setErr('');}}>Отмена</button>
              <button className="btn btn-p btn-sm" style={{flex:2}} disabled={!name.trim()||busy} onClick={()=>run(()=>onCreate(name.trim(),emoji))}>Создать</button>
            </div>
          </div>
        )}
        {mode==='join' && (
          <div style={{display:'flex',flexDirection:'column',gap:8}} className="fu">
            <input className="inp" placeholder="Код приглашения" value={code} maxLength={6} style={{textTransform:'uppercase',letterSpacing:'.2em',fontWeight:700,textAlign:'center'}}
              onChange={e=>setCode(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''))} autoFocus={!compact}/>
            {err && <div className="err">{err}</div>}
            <div className="row">
              <button className="btn btn-g btn-sm" style={{flex:1}} onClick={()=>{setMode(null);setErr('');}}>Отмена</button>
              <button className="btn btn-p btn-sm" style={{flex:2}} disabled={code.length<6||busy} onClick={()=>run(()=>onJoin(code))}>Присоединиться</button>
            </div>
          </div>
        )}
      </div>
    );

  function PersonOverlay({ name, open, onClose, wishes, claims, profile, me, handlers, onImg }) {
    const [onlyFree,setOnlyFree] = useState(false);
    useEffect(()=>{ if(open) setOnlyFree(false); },[name,open]);
    const [c1] = nameColor(name||'А');
    const list = useMemo(()=>wishes
      .filter(w=>!onlyFree || !claims[w.id] || (claims[w.id].coop && !isClaimBy(claims[w.id],me)))
      .slice().sort((a,b)=>{
        const ac=claims[a.id]&&!isClaimBy(claims[a.id],me)?1:0, bc=claims[b.id]&&!isClaimBy(claims[b.id],me)?1:0;
        if(ac!==bc) return ac-bc;
        return (b.priority||2)-(a.priority||2) || (b.createdAt||0)-(a.createdAt||0);
      }),[wishes,claims,onlyFree,me]);
    const free = wishes.filter(w=>!claims[w.id]).length;
    const bd = profile && profile.birthday ? daysUntil(profile.birthday) : null;
    const links = (profile && profile.links) || [];

    return (
      <div className={`person-overlay ${open?'open':''}`}>
        <div style={{position:'fixed',inset:0,pointerEvents:'none',background:`radial-gradient(ellipse 70% 40% at 20% 0%,${c1}33 0%,transparent 60%)`}}/>
        <div className="screen" style={{maxWidth:520,margin:'0 auto',position:'relative'}}>
          <div className="page-header" style={{alignItems:'center',justifyContent:'flex-start',gap:14}}>
            <button className="icon-btn" onClick={onClose}>←</button>
            <Avatar name={name} photo={profile&&profile.photo} size={54}/>
            <div style={{minWidth:0}}>
              <div className="page-title" style={{fontSize:20}}>{name}</div>
              <div className="note" style={{fontSize:12,marginTop:2}}>
                {wishes.length} {plural(wishes.length,['желание','желания','желаний'])} · {free} {plural(free,['свободно','свободно','свободно'])}
                {bd!=null && bd<=60 && <> · 🎂 {whenText(bd)}</>}
              </div>
            </div>
          </div>

          {links.length>0 && (
            <div style={{marginBottom:12}}>
              <div className="note" style={{fontSize:11,marginBottom:6}}>Другие вишлисты:</div>
              <div className="hscroll">{links.map((l,i)=>{ const s=shopOf(l.url); return (
                <a key={i} className="chip" href={normUrl(l.url)} target="_blank" rel="noreferrer" style={{textDecoration:'none',color:'var(--t1)'}}>
                  {s && <img src={s.icon} alt="" style={{width:16,height:16,borderRadius:4,background:'white'}}/>}{l.label||(s&&s.name)||'Ссылка'} ↗
                </a>); })}</div>

          )}

          <div className="glass" style={{padding:'10px 14px',marginBottom:12,fontSize:13,color:'var(--t2)',lineHeight:1.5}}>
            🤫 {name} не видит, кто и что бронирует — сюрприз сохранится!
          </div>

          <div className="row" style={{marginBottom:12}}>
            <button className={`chip ${!onlyFree?'on':''}`} onClick={()=>setOnlyFree(false)}>Все</button>
            <button className={`chip ${onlyFree?'on':''}`} onClick={()=>setOnlyFree(true)}>Свободные · {free}</button>
          </div>

          {list.length===0 && (
            <div className="empty"><div className="big">🎀</div>
              <div style={{fontWeight:700,marginBottom:6}}>{wishes.length?'Всё уже разобрали!':`${name} пока ничего не добавил${(name||'').slice(-1)==='а'?'а':''}`}</div>
              <div className="note">{wishes.length?'Можно присоединиться к складчине или заглянуть позже':'Загляните позже — или намекните лично 😉'}</div>
            </div>
          )}
          {list.map(w=>(
            <WishCardGuest key={w.id} wish={w} claim={claims[w.id]} me={me} onImg={onImg}
              onClaim={handlers.claim} onJoin={handlers.join} onUnclaim={handlers.unclaim}/>
          ))}
        </div>
      </div>
    );
  }

  const PRICE_FILTERS = [
    ['all','Любая цена',()=>true], ['1','до 1 000 ₽',p=>p>0&&p<=1000], ['2','1–3 тыс.',p=>p>1000&&p<=3000],
    ['3','3–10 тыс.',p=>p>3000&&p<=10000], ['4','от 10 тыс.',p=>p>10000],
  ];
  function FeedTab({ wishes, claims, me, people, profiles, handlers, onImg }) {
    const [q,setQ] = useState('');
    const [who,setWho] = useState('all');
    const [onlyFree,setOnlyFree] = useState(false);
    const [price,setPrice] = useState('all');
    const [sort,setSort] = useState('prio');
    const list = useMemo(()=>{
      const pf = PRICE_FILTERS.find(x=>x[0]===price)[2];
      const s = q.trim().toLowerCase();
      let arr = wishes.filter(w=>
        (who==='all'||w.ownerName===who) &&
        (!onlyFree || !claims[w.id] || (claims[w.id].coop && !isClaimBy(claims[w.id],me))) &&
        pf(w.price||0) &&
        (!s || (w.title+' '+(w.note||'')+' '+w.ownerName).toLowerCase().includes(s)));
      const taken = w => claims[w.id]&&!isClaimBy(claims[w.id],me)&&!claims[w.id].coop?1:0;
      arr = arr.slice().sort((a,b)=> taken(a)-taken(b) || (
        sort==='prio' ? (b.priority||2)-(a.priority||2)||(b.createdAt||0)-(a.createdAt||0) :
        sort==='new' ? (b.createdAt||0)-(a.createdAt||0) :
        sort==='cheap' ? (a.price||9e9)-(b.price||9e9) : (b.price||0)-(a.price||0)));
      return arr;
    },[wishes,claims,q,who,onlyFree,price,sort,me]);

    return (
      <div className="screen fu">
        <div className="page-header"><div className="page-title">Идеи<br/>подарков</div><div className="note" style={{fontSize:12}}>{list.length} {plural(list.length,['идея','идеи','идей'])}</div></div>
        <input className="inp" placeholder="🔎 Поиск: наушники, книга, Валера…" value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:10}}/>
        <div className="hscroll" style={{marginBottom:8}}>
          <button className={`chip ${who==='all'?'on':''}`} onClick={()=>setWho('all')}>Все</button>
          {people.map(p=>(
            <button key={p.name} className={`chip ${who===p.name?'on':''}`} onClick={()=>setWho(p.name)} style={{paddingLeft:5}}>
              <Avatar name={p.name} photo={profiles[p.name]&&profiles[p.name].photo} size={22} radius={11}/>{p.name}
            </button>
          ))}
        </div>
        <div className="row" style={{marginBottom:14,flexWrap:'wrap'}}>
          <button className={`chip ${onlyFree?'on':''}`} onClick={()=>setOnlyFree(v=>!v)}>{onlyFree?'✓ ':''}Свободные</button>
          <select value={price} onChange={e=>setPrice(e.target.value)}>{PRICE_FILTERS.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>
          <select value={sort} onChange={e=>setSort(e.target.value)}>
            <option value="prio">🔥 Сначала важные</option><option value="new">🆕 Новые</option>
            <option value="cheap">₽ Дешевле</option><option value="exp">₽₽₽ Дороже</option>
          </select>
        </div>
        {list.length===0 && <div className="empty"><div className="big">🔍</div><div className="note">Ничего не нашлось — попробуйте другие фильтры</div></div>}
        {list.map(w=>(
          <WishCardGuest key={w.id} wish={w} claim={claims[w.id]} me={me} showOwner ownerPhoto={profiles[w.ownerName]&&profiles[w.ownerName].photo}
            onImg={onImg} onClaim={handlers.claim} onJoin={handlers.join} onUnclaim={handlers.unclaim}/>
        ))}
      </div>
    );
  }

  function useProfiles(names, enabled) {
    const [map,setMap] = useState({});
    const key = Array.from(new Set(names.filter(Boolean))).sort().join('|');
    useEffect(()=>{
      if(!enabled || !key) return;
      const arr = key.split('|'); const chunks = [];
      for(let i=0;i<arr.length;i+=10) chunks.push(arr.slice(i,i+10));
      const unsubs = chunks.map(ch => profilesCol().where(firebase.firestore.FieldPath.documentId(),'in',ch).onSnapshot(s=>{
        setMap(m=>{ const n={...m}; ch.forEach(k=>{ delete n[k]; }); s.forEach(d=>{ n[d.id]=d.data(); }); return n; });
      }, e=>console.error('profiles',e)));
      return ()=>unsubs.forEach(u=>u());
    },[key,enabled]);
    return map;
  }

  function App() {
    const savedName = loadLocal('nywish:name','');
    const pinOk = loadLocal('nywish:pin_ok','');
    const [me,setMe] = useState(savedName && pinOk===savedName ? savedName : '');
    const [authUid,setAuthUid] = useState(null);
    const [tab,setTab] = useState('people');
    const [userDoc,setUserDoc] = useState(null);
    const [groupDocs,setGroupDocs] = useState({});
    const [activeGroup,setActiveGroupS] = useState('');
    const [items,setItems] = useState([]);
    const [claims,setClaims] = useState({});
    const [loading,setLoading] = useState(true);
    const [previewImage,setPreviewImage] = useState(null);
    const [sheet,setSheet] = useState(null); // null | {initial}
    const [openPerson,setOpenPerson] = useState(null);
    const [groupSheet,setGroupSheet] = useState(false);
    const [theme,setThemeS] = useState(loadLocal('profile:theme','forest'));
    const [snow,setSnowS] = useState(loadLocal('profile:snow', [10,11,0,1].includes(new Date().getMonth())));
    const [pendingCode,setPendingCode] = useState(()=>{
      const c = new URLSearchParams(location.search).get('join');
      if(c){ saveLocal('nywish:pendingJoin',c.toUpperCase()); history.replaceState(null,'',location.pathname); }
      return loadLocal('nywish:pendingJoin','');
    });
    const [invite,setInvite] = useState(null);

    // ── тема (применяется сразу при запуске)
    useEffect(()=>{
      const t = THEMES.find(x=>x.id===theme)||THEMES[0];
      document.documentElement.style.setProperty('--g1',t.g1);
      document.documentElement.style.setProperty('--g2',t.g2);
      saveLocal('profile:theme',theme);
    },[theme]);
    const setSnow = v => { setSnowS(v); saveLocal('profile:snow',v); };

    useEffect(()=>auth.onAuthStateChanged(u=>setAuthUid(u?u.uid:null)),[]);
    useEffect(()=>{ if(me) setActiveGroupS(loadLocal('nywish:group:'+me,'')); },[me]);

    // ── превью приглашения (для экрана входа)
    useEffect(()=>{
      if(!pendingCode || !authUid) return;
      listsCol().where('code','==',pendingCode).limit(1).get().then(q=>{
        if(q.empty){ toast('Приглашение не найдено','🤷'); saveLocal('nywish:pendingJoin',''); setPendingCode(''); return; }
        setInvite({ id:q.docs[0].id, ...q.docs[0].data() });
      }).catch(console.error);
    },[pendingCode,authUid]);

    // ── профиль пользователя (список групп)
    useEffect(()=>{
      if(!me || !authUid) return;
      return usersCol().doc(me).onSnapshot(s=>setUserDoc(s.exists?s.data():{}), e=>console.error('user',e));
    },[me,authUid]);

    const isLegacyUser = !!userDoc && !Array.isArray(userDoc.groups);
    const groupIds = useMemo(()=> !userDoc ? [] : Array.isArray(userDoc.groups) ? userDoc.groups : [LEGACY_LIST], [userDoc]);
    const gidsKey = groupIds.join('|');

    // Добавить группу пользователю (старым пользователям сохраняем и семейный список)
    const addGroupToUser = gid => usersCol().doc(me).set({ groups: FV.arrayUnion(...(isLegacyUser?[LEGACY_LIST]:[]), gid) },{merge:true});

    // ── миграция: у старого семейного списка появляются название и код приглашения
    const migrated = useRef(false);
    useEffect(()=>{
      if(!me || !authUid || !groupIds.includes(LEGACY_LIST) || migrated.current) return;
      migrated.current = true;
      const ref = listsCol().doc(LEGACY_LIST);
      db.runTransaction(async tx=>{
        const s = await tx.get(ref); const d = s.exists?s.data():{};
        const patch = { members: FV.arrayUnion(me) };
        if(!d.name) patch.name='Наша семья';
        if(!d.emoji) patch.emoji='🎄';
        if(!d.code) patch.code=genCode();
        if(!d.createdAt) patch.createdAt=Date.now();
        tx.set(ref,patch,{merge:true});
      }).then(()=> isLegacyUser && usersCol().doc(me).set({groups:FV.arrayUnion(LEGACY_LIST)},{merge:true}))
        .catch(e=>console.warn('migration (обновите правила Firestore):',e));
    },[me,authUid,gidsKey,isLegacyUser]);

    // ── перенос локального фото профиля в облако (один раз)
    useEffect(()=>{
      if(!me || !authUid) return;
      const lp = loadLocal('profile:photo:'+me,''); const flag = 'nywish:photoMigrated:'+me;
      if(!lp || loadLocal(flag,false)) return;
      profilesCol().doc(me).get().then(s=>{ if(!(s.data()&&s.data().photo)) return profilesCol().doc(me).set({photo:lp},{merge:true}); })
        .then(()=>saveLocal(flag,true)).catch(console.error);
    },[me,authUid]);

    // ── вступление по приглашению после входа
    const joinByCode = async code => {
      const q = await listsCol().where('code','==',code.trim().toUpperCase()).limit(1).get();
      if(q.empty) throw new Error('not-found');
      const g = q.docs[0];
      await listsCol().doc(g.id).set({ members: FV.arrayUnion(me) },{merge:true});
      if(!groupIds.includes(g.id)) await addGroupToUser(g.id);
      setActiveGroup(g.id); setTab('people');
      setTimeout(()=>{ FX.big(); toast(`Добро пожаловать в «${g.data().name}»!`, g.data().emoji||'🎉'); vibrate([30,50,30]); },300);
      return g.id;
    };
    useEffect(()=>{
      if(!me || !authUid || !userDoc || !pendingCode) return;
      saveLocal('nywish:pendingJoin',''); setPendingCode(''); setInvite(null);
      joinByCode(pendingCode).catch(e=>{ console.error(e); toast(e.message==='not-found'?'Приглашение не найдено':'Не удалось вступить в группу','⚠️'); });
    },[me,authUid,!!userDoc,pendingCode]);

    const createGroup = async (name,emoji) => {
      const ref = listsCol().doc();
      await ref.set({ name, emoji, code:genCode(), ownerName:me, members:[me], createdAt:Date.now() });
      await addGroupToUser(ref.id);
      setActiveGroup(ref.id); setGroupSheet(false); setTab('people');
      FX.big(); toast(`Группа «${name}» создана — пригласите близких!`, emoji);
    };
    const leaveGroup = async g => {
      if(!await askConfirm({ e:'🚪', title:`Выйти из «${g.name}»?`, text:'Ваши желания в этой группе останутся, но вы перестанете видеть группу.', ok:'Выйти', danger:true })) return;
      try{
        await usersCol().doc(me).set({ groups: groupIds.filter(x=>x!==g.id) },{merge:true});
        await listsCol().doc(g.id).set({ members: FV.arrayRemove(me) },{merge:true});
        toast('Вы вышли из группы','👋');
      }catch(e){ console.error(e); toast('Не получилось — проверьте правила Firestore','⚠️'); }
    };

    // ── документы групп
    useEffect(()=>{
      if(!authUid || !groupIds.length) return;
      const unsubs = groupIds.map(id => listsCol().doc(id).onSnapshot(
        s => setGroupDocs(g=>({ ...g, [id]: s.exists ? { id, ...s.data() } : { id, name:id===LEGACY_LIST?'Наша семья':'Группа', emoji:'🎄' } })),
        e => console.error('group',e)));
      return ()=>unsubs.forEach(u=>u());
    },[gidsKey,authUid]);
    const groups = groupIds.map(id=>groupDocs[id]||{id,name:'…',emoji:'🎁'});
    const gid = groupIds.includes(activeGroup) ? activeGroup : (groupIds[0]||null);
    const group = gid ? groups.find(g=>g.id===gid) : null;
    const setActiveGroup = id => { setActiveGroupS(id); saveLocal('nywish:group:'+me,id); setGroupSheet(false); };

    // ── желания и брони активной группы
    useEffect(()=>{
      if(!authUid || !gid) return;
      setLoading(true); setItems([]);
      return itemsCol(gid).orderBy('createdAt','desc').onSnapshot(snap=>{
        const a=[]; snap.forEach(d=>a.push({id:d.id,...d.data()})); setItems(a); setLoading(false);
      }, e=>{ console.error(e); setLoading(false); });
    },[gid,authUid]);
    useEffect(()=>{
      if(!authUid || !gid) return;
      setClaims({});
      return claimsCol(gid).onSnapshot(snap=>{ const m={}; snap.forEach(d=>m[d.id]=d.data()); setClaims(m); }, e=>{ console.error(e); setClaims({}); });
    },[gid,authUid]);

    // ── производные данные
    const visible = useMemo(()=>items.filter(i=>!i.archivedAt),[items]);
    const myWishes = useMemo(()=>visible.filter(i=>i.ownerName===me),[visible,me]);
    const others = useMemo(()=>visible.filter(i=>i.ownerName!==me),[visible,me]);
    const myGifts = useMemo(()=>items.filter(i=>i.ownerName!==me && isClaimBy(claims[i.id],me)),[items,claims,me]);

    const people = useMemo(()=>{
      const names = new Set([...(group&&group.members||[]), ...others.map(i=>i.ownerName)].filter(n=>n&&n!==me));
      return Array.from(names).map(name=>{
        const ws = others.filter(i=>i.ownerName===name);
        const taken = ws.filter(w=>claims[w.id]).length;
        const mine = ws.filter(w=>isClaimBy(claims[w.id],me)).length;
        return { name, total:ws.length, taken, free:ws.length-taken, mine };
      }).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
    },[group,others,claims,me]);
    const covered = people.filter(p=>p.mine>0).length;

    const profiles = useProfiles([me, ...people.map(p=>p.name)], !!(me&&authUid));
    const myProfile = profiles[me]||{};
    const saveProfile = patch => profilesCol().doc(me).set(patch,{merge:true}).catch(e=>{ console.error(e); toast('Не сохранилось — проверьте правила Firestore','⚠️'); });

    const events = useMemo(()=>{
      const ev = HOLIDAYS.map(h=>({ key:h.label, e:h.e, label:h.label, until:h.until, days:daysUntil(h.date) }));
      people.forEach(p=>{ const b=profiles[p.name]&&profiles[p.name].birthday; if(b) ev.push({ key:'bd'+p.name, e:'🎂', label:'ДР · '+p.name, until:'До дня рождения · '+p.name, days:daysUntil(b) }); });
      return ev.filter(x=>x.days!=null && x.days<=120).sort((a,b)=>a.days-b.days).slice(0,5);
    },[people,profiles]);

    // ── достижение «порадовал всех»
    useEffect(()=>{
      if(!gid || people.length<2 || covered!==people.length) return;
      const k='nywish:ach:all:'+gid+':'+people.length;
      if(loadLocal(k,false)) return; saveLocal(k,true);
      setTimeout(()=>{ FX.big(); toast('У каждого будет подарок от вас! 🎅','🏆'); },400);
    },[covered,people.length,gid]);

    // ── действия с желаниями
    const saveWish = async (data, el) => {
      const editing = sheet && sheet.initial;
      try {
        if(editing){ await itemsCol(gid).doc(editing.id).update({ ...data, updatedAt:Date.now() }); toast('Сохранено','✓'); }
        else {
          await itemsCol(gid).add({ ...data, ownerName:me, addedByUid:authUid, createdAt:Date.now() });
          burstFrom(el,{n:40}); vibrate(20);
          toast(myWishes.length===0?'Первое желание! Пусть сбудется ✨':data.priority===3?'Мечта добавлена 🔥':'Желание добавлено','🌟');
        }
        setSheet(null);
      } catch(e){ console.error(e); toast('Не удалось сохранить','⚠️'); }
    };
    // Убрать желание: если кто-то уже забронировал — мягко архивируем, чтобы дарящий узнал (сам владелец этого не видит)
    const archiveWish = async (wish) => {
      const ref = itemsCol(gid).doc(wish.id);
      const c = await claimsCol(gid).doc(wish.id).get();
      if(c.exists) await ref.update({ archivedAt:Date.now() }); else await ref.delete();
    };
    const removeWish = async wish => {
      if(!await askConfirm({ e:'🗑️', title:'Убрать желание?', text:`«${wish.title}» исчезнет из вашего списка.`, ok:'Убрать', danger:true })) return;
      try{ await archiveWish(wish); toast('Убрано','🗑️'); }catch(e){ console.error(e); toast('Не получилось','⚠️'); }
    };
    const receivedWish = async (wish, el) => {
      burstFrom(el,{n:50,emoji:null}); vibrate([20,40,20]);
      try{ await archiveWish(wish); toast('Ура! Мечта сбылась 🎉','🎁'); }catch(e){ console.error(e); }
    };

    // ── брони
    const claimWish = async (wish, coop, el) => {
      if(wish.ownerName===me) return;
      const ref = claimsCol(gid).doc(wish.id);
      try {
        await db.runTransaction(async tx=>{
          const s = await tx.get(ref); if(s.exists) throw new Error('taken');
          tx.set(ref,{ claimerName:me, claimerUid:authUid, createdAt:Date.now(), status:'reserved', coop:!!coop, participants:[me] });
        });
        burstFrom(el,{n:coop?35:60, ...(coop?{emoji:['🤝','✨']}:{})}); vibrate([15,30,15]);
        const p = people.find(x=>x.name===wish.ownerName);
        toast(coop?'Складчина открыта — другие увидят и присоединятся':(p&&p.mine===0?`${wish.ownerName} будет рад(а)! Первый подарок от вас`:'Забронировано — сюрприз в безопасности'), coop?'🤝':'🎁');
      } catch(e){ toast(e.message==='taken'?'Кто-то успел раньше 😅':'Не удалось забронировать','⚠️'); }
    };
    const joinCoop = async (wish, el) => {
      const ref = claimsCol(gid).doc(wish.id);
      try {
        await db.runTransaction(async tx=>{
          const s = await tx.get(ref); if(!s.exists) throw new Error('gone');
          const d = s.data(); if(!d.coop) throw new Error('solo');
          tx.update(ref,{ participants: Array.from(new Set([...claimParts(d), me])) });
        });
        burstFrom(el,{n:30,emoji:['🤝','💛']}); vibrate(20); toast('Вы в складчине!','🤝');
      } catch(e){ toast('Не получилось присоединиться','⚠️'); }
    };
    const unclaimWish = async wish => {
      if(!await askConfirm({ e:'↩️', title:'Снять бронь?', text:`«${wish.title}» снова станет свободным для других.`, ok:'Снять' })) return;
      const ref = claimsCol(gid).doc(wish.id);
      try {
        await db.runTransaction(async tx=>{
          const s = await tx.get(ref); if(!s.exists) return;
          const d = s.data(); const rest = claimParts(d).filter(n=>n!==me);
          if(!isClaimBy(d,me)) throw new Error('not-owner');
          if(rest.length===0) tx.delete(ref);
          else tx.update(ref,{ participants:rest, claimerName: d.claimerName===me ? rest[0] : d.claimerName });
        });
        toast('Бронь снята','↩️');
      } catch(e){ toast(e.message==='not-owner'?'Это не ваша бронь':'Не удалось снять бронь','⚠️'); }
    };
    const setStatus = async (wish, status, el) => {
      try {
        await claimsCol(gid).doc(wish.id).update({ status });
        vibrate(15);
        if(status==='given'){ burstFrom(el,{n:70,emoji:null,power:1.2}); toast(`Подарок вручён: ${wish.ownerName} 🎉`,'🎊');
          const left = myGifts.filter(w=>w.id!==wish.id && (claims[w.id]||{}).status!=='given').length;
          if(left===0) setTimeout(()=>{ FX.big(); toast('Все подарки вручены — вы лучший! 🏆','🎅'); },500);
        } else if(status==='bought'){ burstFrom(el,{n:30,emoji:['🛍️','✨']}); toast('Куплено — минус одна забота','🛍️'); }
        else if(status==='wrapped'){ burstFrom(el,{n:30,emoji:['🎀','✨']}); toast('Красиво упаковано!','🎀'); }
      } catch(e){ console.error(e); toast('Не удалось обновить статус','⚠️'); }
    };
    const handlers = { claim:claimWish, join:joinCoop, unclaim:unclaimWish };

    // ── оверлей человека + кнопка «назад» на телефоне
    const openPersonFn = name => { setOpenPerson(name); history.pushState({person:name},''); };
    const closePerson = () => { if(history.state && history.state.person) history.back(); else setOpenPerson(null); };
    useEffect(()=>{ const h=()=>setOpenPerson(null); addEventListener('popstate',h); return ()=>removeEventListener('popstate',h); },[]);

    const logout = async () => {
      if(!await askConfirm({ e:'👋', title:'Выйти из аккаунта?', ok:'Выйти', danger:true })) return;
      saveLocal('nywish:pin_ok',''); setMe(''); setUserDoc(null); setGroupDocs({}); setItems([]); setClaims({}); setTab('people'); migrated.current=false;
    };

    const fx = (<>{snow && <Snow/>}<ToastHost/><ConfirmHost/><RingDefs/></>);

    if(!me) return (<>{fx}<AuthScreen invite={invite} onAuth={(name,isNew)=>{ setMe(name); setTab(isNew?'my':'people'); if(isNew) setTimeout(()=>{FX.big();toast(`Добро пожаловать, ${name}!`,'🎉');},300); }}/></>);

    // Нет ни одной группы — онбординг
    if(userDoc && groupIds.length===0) return (
      <>{fx}
        <div className="app"><div className="screen fu" style={{paddingTop:40}}>
          <div className="empty" style={{paddingBottom:16}}><div className="big">🏡</div>
            <div className="page-title" style={{marginBottom:10}}>Привет, {me}!</div>
            <div className="note">Вишлисты живут в группах: семья, друзья, коллеги.<br/>Создайте свою или вступите по коду от близких.</div>
          </div>
          <div className="card"><GroupCreateJoin onCreate={createGroup} onJoin={joinByCode}/></div>
          <button className="btn btn-g btn-block" style={{marginTop:20}} onClick={logout}>Выйти</button>
        </div></div>
      </>
    );

    const activeGifts = myGifts.filter(w=>(claims[w.id]||{}).status!=='given').length;
    const NAV = [
      { id:'people',  icon:'👥', label:'Люди' },
      { id:'feed',    icon:'💡', label:'Идеи' },
      { id:'my',      icon:'⭐', label:'Моё' },
      { id:'gifts',   icon:'🎁', label:'Дарю', badge:activeGifts },
      { id:'profile', icon:'👤', label:'Профиль' },
    ];

    return (
      <>{fx}
      <div className="app">
        {tab==='people' && <PeopleTab group={group} groups={groups} people={people} profiles={profiles} loading={loading} events={events}
          covered={covered} onOpen={openPersonFn} onOpenGroups={()=>setGroupSheet(true)}/>}
        {tab==='feed' && <FeedTab wishes={others} claims={claims} me={me} people={people} profiles={profiles} handlers={handlers} onImg={setPreviewImage}/>}
        {tab==='my' && <MyTab me={me} wishes={myWishes} loading={loading} profile={myProfile} onSaveLinks={links=>saveProfile({links})}
          onEdit={w=>setSheet({initial:w})} onRemove={removeWish} onReceived={receivedWish} onImg={setPreviewImage}/>}
        {tab==='gifts' && <GiftsTab gifts={myGifts} claims={claims} me={me} profiles={profiles} onStatus={setStatus} onUnclaim={unclaimWish}
          onImg={setPreviewImage} onGoPeople={()=>setTab('people')}/>}
        {tab==='profile' && <ProfileTab me={me} profile={myProfile} onSaveProfile={saveProfile}
          stats={{wishes:myWishes.length,gifts:myGifts.length,given:myGifts.filter(w=>(claims[w.id]||{}).status==='given').length}}
          groups={groups} activeId={gid} onPickGroup={id=>{setActiveGroup(id);toast('Группа: '+((groupDocs[id]||{}).name||''),(groupDocs[id]||{}).emoji||'🎁');}}
          onLeaveGroup={leaveGroup} onCreateGroup={createGroup} onJoinGroup={joinByCode}
          theme={theme} setTheme={setThemeS} snow={snow} setSnow={setSnow} onLogout={logout}/>}

        {(tab==='my'||tab==='feed') && <button className="fab" onClick={()=>{vibrate(10);setSheet({initial:null});}}>＋</button>}

        <nav className="bottom-nav">
          {NAV.map(n=>(
            <div key={n.id} className={`nav-item ${tab===n.id?'on':''}`} onClick={()=>{ if(tab!==n.id) vibrate(8); setTab(n.id); window.scrollTo({top:0}); }}>
              <div className="nav-icon">{n.icon}</div>
              <div className="nav-label">{n.label}</div>
              {n.badge>0 && <div className="nav-badge">{n.badge}</div>}
            </div>
          ))}
        </nav>

        <WishSheet open={!!sheet} initial={sheet&&sheet.initial} onClose={()=>setSheet(null)} onSave={saveWish}/>

        <Sheet open={groupSheet} onClose={()=>setGroupSheet(false)}>
          <div className="sheet-title">Группы</div>
          <GroupList groups={groups} activeId={gid} me={me} onPick={setActiveGroup}/>
          <div style={{marginTop:12}}><GroupCreateJoin onCreate={createGroup} onJoin={joinByCode} compact/></div>
        </Sheet>

        <PersonOverlay name={openPerson||''} open={!!openPerson} onClose={closePerson}
          wishes={others.filter(w=>w.ownerName===openPerson)} claims={claims} profile={profiles[openPerson]} me={me}
          handlers={handlers} onImg={setPreviewImage}/>

        {previewImage && (
          <div className="img-overlay" onClick={()=>setPreviewImage(null)}>
            <img src={previewImage} alt="" style={{maxHeight:'85vh',maxWidth:'92vw',borderRadius:18,boxShadow:'0 30px 80px rgba(0,0,0,.7)'}}/>
          </div>
        )}
      </div>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
