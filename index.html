<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Подарки, подарочки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore-compat.js"></script>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f110d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Подарки">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));</script>
  <style>
    :root {
      --bg:#0f110d; --s1:#181c15; --s2:#1f2419;
      --b1:rgba(255,255,255,0.07); --b2:rgba(255,255,255,0.13);
      --t1:#f0ece4; --t2:#8a9080;
      --g1:#5a7a38; --g2:#7ea858; --gold:#c8a96e;
      --nav-h:64px;
    }
    *{box-sizing:border-box;}
    body{font-family:'Golos Text',sans-serif;background:var(--bg);color:var(--t1);margin:0;overflow-x:hidden;overscroll-behavior:none;}

    /* Mesh bg */
    .mesh-bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
    .mesh-bg::before{content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse 70% 50% at 10% 15%,rgba(80,110,50,0.2) 0%,transparent 60%),
                 radial-gradient(ellipse 50% 60% at 90% 85%,rgba(100,70,30,0.15) 0%,transparent 60%);
      animation:meshMove 14s ease-in-out infinite alternate;}
    @keyframes meshMove{0%{opacity:1;transform:scale(1)}100%{opacity:.75;transform:scale(1.05)}}
    .bg-photo{position:fixed;inset:0;z-index:-1;background-image:url('E3888A90-B1B8-4628-B6F1-032D4C9FFF50.png');background-size:cover;background-position:center;opacity:.05;}

    /* Layout */
    .app{position:relative;z-index:1;max-width:520px;margin:0 auto;}
    .screen{padding:0 16px;padding-bottom:calc(var(--nav-h) + 16px);}
    .page-header{padding:24px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .page-title{font-family:'Unbounded',sans-serif;font-size:clamp(1.2rem,5vw,1.6rem);font-weight:900;line-height:1.1;
      background:linear-gradient(135deg,#a8c878,#c8a96e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

    /* Bottom Nav */
    .bottom-nav{
      position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      width:100%;max-width:520px;
      background:rgba(24,28,21,0.92);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border-top:1px solid var(--b2);
      display:flex;z-index:100;
      height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom,0);
    }
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:opacity .15s;position:relative;}
    .nav-item:active{opacity:.7;}
    .nav-icon{font-size:22px;line-height:1;transition:transform .2s;}
    .nav-item.on .nav-icon{transform:scale(1.1);}
    .nav-label{font-size:9px;font-weight:600;color:var(--t2);letter-spacing:0.03em;transition:color .2s;}
    .nav-item.on .nav-label{color:#9aba70;}
    .nav-dot{width:4px;height:4px;border-radius:50%;background:#9aba70;position:absolute;top:6px;}

    /* Cards */
    .card{background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:16px;transition:border-color .2s;}
    .card+.card{margin-top:10px;}

    /* Inputs */
    .inp,.txta{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:14px;padding:11px 14px;color:var(--t1);font-family:'Golos Text',sans-serif;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;}
    .inp::placeholder,.txta::placeholder{color:var(--t2);}
    .inp:focus,.txta:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(126,168,88,.18);background:#222819;}
    .txta{resize:none;}

    /* Buttons */
    .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:11px 22px;font-family:'Golos Text',sans-serif;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .18s;}
    .btn:active{transform:scale(.97);}
    .btn-p{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--t1);box-shadow:0 4px 18px rgba(90,122,56,.35);}
    .btn-p:hover{box-shadow:0 6px 22px rgba(90,122,56,.5);transform:translateY(-1px);}
    .btn-p:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
    .btn-g{background:var(--s2);color:var(--t2);border:1px solid var(--b2);}
    .btn-g:hover{border-color:rgba(255,255,255,.2);color:var(--t1);}
    .btn-d{background:rgba(200,80,60,.1);color:#e07060;border:1px solid rgba(200,80,60,.2);}

    /* Badges */
    .badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;}
    .b-green{background:rgba(126,168,88,.12);color:#9aba70;border:1px solid rgba(126,168,88,.25);}
    .b-gold{background:rgba(200,169,110,.15);color:var(--gold);border:1px solid rgba(200,169,110,.3);}
    .b-muted{background:var(--s2);color:var(--t2);border:1px solid var(--b2);}

    .err{color:#e07878;font-size:13px;}
    .note{color:var(--t2);font-size:13px;}
    .sec{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);margin-bottom:10px;}
    .divider{height:1px;background:var(--b1);margin:12px 0;}

    /* Person card */
    .person-card{background:var(--s1);border:1px solid var(--b1);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .2s;}
    .person-card:hover{border-color:var(--b2);transform:translateY(-1px);}
    .person-card+.person-card{margin-top:8px;}
    .avatar{border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:700;color:white;flex-shrink:0;}

    /* Wish card */
    .wish-card{background:var(--s1);border:1px solid var(--b1);border-radius:18px;padding:14px;transition:border-color .2s;}
    .wish-card+.wish-card{margin-top:8px;}
    .wish-card.claimed{opacity:.55;}

    /* FAB */
    .fab{position:fixed;bottom:calc(var(--nav-h) + 14px);right:max(16px,calc(50vw - 244px));width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 20px rgba(90,122,56,.45);cursor:pointer;transition:all .2s;z-index:90;border:none;}
    .fab:hover{transform:scale(1.08);box-shadow:0 8px 26px rgba(90,122,56,.55);}
    .fab:active{transform:scale(.95);}

    /* Person detail overlay */
    .person-overlay{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.22,.68,0,1.1);}
    .person-overlay.open{transform:translateX(0);}
    .person-overlay .screen{max-width:520px;margin:0 auto;}

    /* Add modal */
    .modal-bg{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
    .modal-bg.open{opacity:1;pointer-events:all;}
    .modal-sheet{background:var(--s1);border:1px solid var(--b2);border-radius:24px 24px 0 0;padding:24px 20px;width:100%;max-width:520px;transform:translateY(100%);transition:transform .3s cubic-bezier(.22,.68,0,1.1);max-height:90vh;overflow-y:auto;}
    .modal-bg.open .modal-sheet{transform:translateY(0);}
    .modal-handle{width:36px;height:4px;border-radius:2px;background:var(--b2);margin:0 auto 18px;}

    /* Image preview */
    .img-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;}

    /* Select */
    select{background:var(--s2);border:1px solid var(--b2);border-radius:10px;color:var(--t1);padding:6px 10px;font-family:'Golos Text',sans-serif;font-size:12px;outline:none;cursor:pointer;}

    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .fu{animation:fadeUp .3s cubic-bezier(.22,.68,0,1.2) both;}
  </style>
</head>
<body>
<div class="bg-photo"></div>
<div class="mesh-bg"></div>
<div id="root"></div>

<script type="text/babel">
  const { useEffect, useState, useMemo, useRef, useCallback } = React;

  const firebaseConfig = {
    apiKey:"AIzaSyC26Xjjr0pFQDVFtCgRyteEpNEjngVOJFI",
    authDomain:"wishlist-37819.firebaseapp.com",
    projectId:"wishlist-37819",
    storageBucket:"wishlist-37819.firebasestorage.app",
    messagingSenderId:"72495355387",
    appId:"1:72495355387:web:0ff709125d3cf33c8c275e"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  auth.signInAnonymously().catch(console.error);

  const LIST_ID = 'newyear2025';
  const listDoc   = db.collection('lists').doc(LIST_ID);
  const itemsCol  = () => listDoc.collection('items');
  const claimsCol = () => listDoc.collection('claims');
  const usersCol  = () => db.collection('users');

  const saveLocal = (k,v) => localStorage.setItem(k, JSON.stringify(v));
  const loadLocal = (k,fb) => { try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;} };

  async function compressImage(file) {
    return new Promise((res,rej) => {
      const r = new FileReader();
      r.onload = e => {
        const img = new Image();
        img.onload = () => {
          const s = Math.min(800/img.width,800/img.height,1);
          const c = document.createElement('canvas');
          c.width=img.width*s; c.height=img.height*s;
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          const d = c.toDataURL('image/jpeg',.7);
          if(d.length>900000){rej('Слишком большое.');return;}
          res(d);
        };
        img.onerror=()=>rej('Не удалось прочитать.');
        img.src=e.target.result;
      };
      r.onerror=()=>rej('Ошибка файла.');
      r.readAsDataURL(file);
    });
  }

  async function hashPin(pin) {
    const buf = await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pin+'podarki_salt'));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  const NAME_COLORS = [
    ['#5a7a38','#7ea858'],['#8a6a30','#c8a96e'],['#3a6050','#5a9070'],
    ['#7a5030','#b87840'],['#4a6840','#7a9858'],['#6a5040','#9a7858'],
  ];
  function nameColor(name) {
    const idx = name.split('').reduce((a,c)=>a+c.charCodeAt(0),0) % NAME_COLORS.length;
    return NAME_COLORS[idx];
  }

  // ══════════════════════════════════════
  // AUTH SCREEN
  // ══════════════════════════════════════
  function AuthScreen({ onAuth }) {
    const [step,setStep] = useState('name');
    const [nameInput,setNameInput] = useState('');
    const [pin,setPin] = useState('');
    const [pin2,setPin2] = useState('');
    const [loading,setLoading] = useState(false);
    const [error,setError] = useState('');

    const handleName = async () => {
      const name = nameInput.trim();
      if(!name) return;
      setLoading(true); setError('');
      try {
        const doc = await usersCol().doc(name).get();
        // Профиль есть → вход по PIN
        // Профиля нет → регистрация (в том числе миграция старых пользователей)
        setStep(doc.exists ? 'pin_enter' : 'pin_new');
      } catch(e) {
        console.error('handleName error:', e);
        // Скорее всего правило users ещё не добавлено в Firebase
        if(e.code === 'permission-denied') {
          setError('Ошибка доступа. Добавьте правило для коллекции users в Firebase Console.');
        } else {
          setError('Ошибка соединения. Проверьте интернет и попробуйте ещё раз.');
        }
      }
      setLoading(false);
    };

    const handleRegister = async () => {
      if(pin.length<4){setError('PIN минимум 4 цифры.');return;}
      if(pin!==pin2){setError('PIN-коды не совпадают.');return;}
      setLoading(true); setError('');
      try {
        const hashed = await hashPin(pin);
        const ref = usersCol().doc(nameInput.trim());
        await db.runTransaction(async tx => {
          const snap = await tx.get(ref);
          if(snap.exists) throw new Error('taken');
          tx.set(ref,{pinHash:hashed,createdAt:Date.now()});
        });
        saveLocal('nywish:name',nameInput.trim());
        saveLocal('nywish:pin_ok',nameInput.trim());
        onAuth(nameInput.trim());
      } catch(e) {
        console.error('handleRegister error:', e);
        if(e.message==='taken'){
          // Гонка — пока вводили PIN, кто-то занял имя → переходим к вводу PIN
          setError('Это имя уже зарегистрировано. Введите PIN.');
          setStep('pin_enter'); setPin(''); setPin2('');
        } else if(e.code==='permission-denied') {
          setError('Ошибка доступа. Добавьте правило для коллекции users в Firebase Console.');
        } else {
          setError('Не удалось зарегистрироваться. Попробуйте ещё раз.');
        }
      }
      setLoading(false);
    };

    const handleLogin = async () => {
      if(!pin) return;
      setLoading(true); setError('');
      try {
        const doc = await usersCol().doc(nameInput.trim()).get();
        if(!doc.exists){setError('Профиль не найден.');setLoading(false);return;}
        const hashed = await hashPin(pin);
        if(doc.data().pinHash !== hashed){setError('Неверный PIN. Попробуйте ещё раз.');setPin('');setLoading(false);return;}
        saveLocal('nywish:name',nameInput.trim());
        saveLocal('nywish:pin_ok',nameInput.trim());
        onAuth(nameInput.trim());
      } catch(e) {
        console.error('handleLogin error:', e);
        if(e.code==='permission-denied') {
          setError('Ошибка доступа. Добавьте правило для коллекции users в Firebase Console.');
        } else {
          setError('Ошибка соединения. Проверьте интернет и попробуйте ещё раз.');
        }
      }
      setLoading(false);
    };

    return (
      <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px 20px',position:'relative',zIndex:1}}>
        <div style={{width:'100%',maxWidth:360}}>
          <div style={{textAlign:'center',marginBottom:32}}>
            <div style={{fontSize:52,marginBottom:12}}>🎁</div>
            <div style={{fontFamily:"'Unbounded',sans-serif",fontSize:22,fontWeight:900,lineHeight:1.1,
              background:'linear-gradient(135deg,#a8c878,#c8a96e)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>
              Подарки,<br/>подарочки
            </div>
          </div>

          <div className="card">
            {step==='name' && (<>
              <div className="sec" style={{marginBottom:12}}>Войти или зарегистрироваться</div>
              <input className="inp" placeholder="Ваше имя (Ира, Валера…)" value={nameInput}
                onChange={e=>{setNameInput(e.target.value);setError('');}}
                onKeyDown={e=>e.key==='Enter'&&nameInput.trim()&&handleName()}
                style={{marginBottom:10}} autoFocus />
              {error&&<div className="err" style={{marginBottom:8}}>
                {error}
                {error.includes('доступа')&&<div style={{marginTop:6,fontSize:11,color:'var(--t2)',lineHeight:1.5}}>
                  Добавьте в Firebase Console → Firestore → Rules:<br/>
                  <code style={{fontSize:10,background:'var(--s2)',padding:'2px 6px',borderRadius:6,display:'inline-block',marginTop:4}}>match /users/{'{'}userName{'}'} {'{'} allow read, create: if request.auth != null; {'}'}</code>
                </div>}
              </div>}
              <button className="btn btn-p" style={{width:'100%'}} onClick={handleName} disabled={!nameInput.trim()||loading}>
                {loading?'Проверяем…':'Продолжить →'}
              </button>
            </>)}

            {step==='pin_new' && (<>
              <div className="sec" style={{marginBottom:4}}>Придумайте PIN</div>
              <div className="note" style={{marginBottom:12}}>Имя <strong style={{color:'var(--t1)'}}>{nameInput.trim()}</strong> свободно! Задайте PIN — он защитит ваш профиль.</div>
              <input className="inp" type="password" inputMode="numeric" placeholder="PIN (мин. 4 цифры)" value={pin}
                onChange={e=>{setPin(e.target.value.replace(/\D/g,''));setError('');}} maxLength={8} style={{marginBottom:8}} autoFocus />
              <input className="inp" type="password" inputMode="numeric" placeholder="Повторите PIN" value={pin2}
                onChange={e=>{setPin2(e.target.value.replace(/\D/g,''));setError('');}} maxLength={8} style={{marginBottom:10}}
                onKeyDown={e=>e.key==='Enter'&&handleRegister()} />
              {error&&<div className="err" style={{marginBottom:8}}>{error}</div>}
              <div style={{display:'flex',gap:8}}>
                <button className="btn btn-g" style={{flex:1}} onClick={()=>{setStep('name');setPin('');setPin2('');setError('');}}>← Назад</button>
                <button className="btn btn-p" style={{flex:2}} onClick={handleRegister} disabled={pin.length<4||!pin2||loading}>
                  {loading?'Регистрируем…':'Создать профиль ✓'}
                </button>
              </div>
            </>)}

            {step==='pin_enter' && (<>
              <div className="sec" style={{marginBottom:4}}>Введите PIN</div>
              <div className="note" style={{marginBottom:12}}>Привет, <strong style={{color:'var(--t1)'}}>{nameInput.trim()}</strong>! Введите PIN для входа.</div>
              <input className="inp" type="password" inputMode="numeric" placeholder="Ваш PIN" value={pin}
                onChange={e=>{setPin(e.target.value.replace(/\D/g,''));setError('');}} maxLength={8} style={{marginBottom:10}}
                onKeyDown={e=>e.key==='Enter'&&handleLogin()} autoFocus />
              {error&&<div className="err" style={{marginBottom:8}}>{error}</div>}
              <div style={{display:'flex',gap:8}}>
                <button className="btn btn-g" style={{flex:1}} onClick={()=>{setStep('name');setPin('');setError('');}}>← Назад</button>
                <button className="btn btn-p" style={{flex:2}} onClick={handleLogin} disabled={!pin||loading}>
                  {loading?'Проверяем…':'Войти →'}
                </button>
              </div>
            </>)}
          </div>
        </div>
      </div>
    );
  }

  // ══════════════════════════════════════
  // WISH CARD (чужое)
  // ══════════════════════════════════════
  function WishCardGuest({ wish, claim, userName, authUid, onClaim, onUnclaim, onImgClick }) {
    const claimed = !!claim;
    const mine = claim?.claimerName === userName;
    const [tip,setTip] = useState(false);
    return (
      <div className={`wish-card ${claimed&&!mine?'claimed':''}`}>
        {wish.image&&<img src={wish.image} alt="" style={{width:'100%',borderRadius:12,maxHeight:200,objectFit:'cover',marginBottom:10,cursor:'pointer'}} onClick={()=>onImgClick(wish.image)} />}
        <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:15,color:'var(--t1)',marginBottom:3}}>{wish.title}</div>
            {wish.note&&<div className="note" style={{marginBottom:4}}>{wish.note}</div>}
            {wish.url&&<a href={wish.url} target="_blank" rel="noreferrer" style={{fontSize:12,color:'#9aba70',textDecoration:'none'}}>Открыть ↗</a>}
          </div>
          <div style={{flexShrink:0,position:'relative'}}>
            {claimed ? (mine ? (
              <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6}}>
                <span className="badge b-green">🎁 Вы дарите</span>
                <button className="btn btn-g" style={{fontSize:12,padding:'5px 12px'}} onClick={onUnclaim}>Снять</button>
              </div>
            ) : (
              <div onMouseEnter={()=>setTip(true)} onMouseLeave={()=>setTip(false)} onClick={()=>setTip(t=>!t)}>
                <button className="btn btn-g" style={{fontSize:12,padding:'7px 14px',cursor:'default'}}>Занято</button>
                {tip&&<div style={{position:'absolute',right:0,bottom:'calc(100% + 6px)',background:'#1c1c28',border:'1px solid var(--b2)',color:'var(--t1)',fontSize:11,padding:'5px 10px',borderRadius:10,whiteSpace:'nowrap',zIndex:10,boxShadow:'0 8px 24px rgba(0,0,0,.4)'}}>🎁 Дарит: {claim.claimerName}</div>}
              </div>
            )) : (
              <button className="btn btn-p" style={{fontSize:12,padding:'8px 16px'}} onClick={onClaim}>Я подарю 🎁</button>
            )}
          </div>
        </div>
      </div>
    );
  }

  // WISH CARD (своё)
  // ══════════════════════════════════════
  function WishCardMy({ wish, locked, onDelete, onUpdate, onImgClick }) {
    const [editing,setEditing] = useState(false);
    const [title,setTitle] = useState(wish.title||'');
    const [url,setUrl]   = useState(wish.url||'');
    const [note,setNote] = useState(wish.note||'');
    const [img,setImg]   = useState(wish.image||'');
    const [imgErr,setImgErr] = useState('');
    const [imgLoad,setImgLoad] = useState(false);

    useEffect(()=>{setTitle(wish.title||'');setUrl(wish.url||'');setNote(wish.note||'');setImg(wish.image||'');setEditing(false);},[wish.id]);

    const handleFile = async e => {
      const f=e.target.files?.[0]; if(!f)return;
      setImgLoad(true); setImgErr('');
      try{setImg(await compressImage(f));}catch(err){setImgErr(typeof err==='string'?err:'Ошибка.');}finally{setImgLoad(false);}
    };

    if(editing) return (
      <div className="card" style={{display:'flex',flexDirection:'column',gap:8}}>
        <div className="sec">Редактирование</div>
        <input className="inp" value={title} onChange={e=>setTitle(e.target.value)} placeholder="Название" />
        <input className="inp" value={url} onChange={e=>setUrl(e.target.value)} placeholder="Ссылка" />
        <textarea className="txta" rows="2" value={note} onChange={e=>setNote(e.target.value)} placeholder="Комментарий" />
        <input type="file" accept="image/*" className="inp" style={{fontSize:12}} onChange={handleFile} />
        {imgLoad&&<div className="note">Сжимается…</div>}
        {imgErr&&<div className="err">{imgErr}</div>}
        {img&&!imgLoad&&<img src={img} alt="" style={{borderRadius:12,maxHeight:120,width:'100%',objectFit:'cover',cursor:'pointer'}} onClick={()=>onImgClick(img)} />}
        <div className="divider"/>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button className="btn btn-g" style={{fontSize:13,padding:'8px 16px'}} onClick={()=>setEditing(false)}>Отмена</button>
          <button className="btn btn-p" style={{fontSize:13,padding:'8px 16px'}} onClick={async()=>{await onUpdate(wish.id,{title:title.trim(),url:url.trim(),note:note.trim(),image:img||null});setEditing(false);}}>Сохранить</button>
        </div>
      </div>
    );

    return (
      <div className="wish-card">
        {wish.image&&<img src={wish.image} alt="" style={{width:'100%',borderRadius:12,maxHeight:200,objectFit:'cover',marginBottom:10,cursor:'pointer'}} onClick={()=>onImgClick(wish.image)} />}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,marginBottom:8}}>
          <div>
            <div style={{fontWeight:600,color:'var(--t1)',fontSize:15,marginBottom:3}}>{wish.title}</div>
            {wish.note&&<div className="note" style={{marginBottom:3}}>{wish.note}</div>}
            {wish.url&&<a href={wish.url} target="_blank" rel="noreferrer" style={{fontSize:12,color:'#9aba70',textDecoration:'none'}}>Открыть ↗</a>}
          </div>
          <span className="badge b-muted" style={{flexShrink:0}}>моё</span>
        </div>
        <div className="divider"/>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button className="btn btn-g" style={{fontSize:12,padding:'7px 14px'}} onClick={()=>!locked&&setEditing(true)} disabled={locked}>Изменить</button>
          <button className="btn btn-d" style={{fontSize:12,padding:'7px 14px'}} onClick={()=>window.confirm('Удалить?')&&onDelete(wish.id)}>Удалить</button>
        </div>
      </div>
    );
  }

  // ADD WISH SHEET
  // ══════════════════════════════════════
  function AddWishSheet({ open, onClose, onAdd, disabled, error }) {
    const [title,setTitle]=useState('');const [url,setUrl]=useState('');const [note,setNote]=useState('');
    const [img,setImg]=useState('');const [imgErr,setImgErr]=useState('');const [imgLoad,setImgLoad]=useState(false);

    const reset = () => {setTitle('');setUrl('');setNote('');setImg('');setImgErr('');}
    const submit = () => {
      if(!title.trim()) return;
      onAdd({title:title.trim(),url:url.trim(),note:note.trim(),image:img});
      reset(); onClose();
    };
    const handleFile = async e => {
      const f=e.target.files?.[0]; if(!f)return;
      setImgLoad(true); setImgErr('');
      try{setImg(await compressImage(f));}catch(err){setImg('');setImgErr(typeof err==='string'?err:'Ошибка.');}finally{setImgLoad(false);}
    };

    return (
      <div className={`modal-bg ${open?'open':''}`} onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div className="modal-sheet">
          <div className="modal-handle"/>
          <div style={{fontFamily:"'Unbounded',sans-serif",fontSize:14,fontWeight:700,marginBottom:16,color:'var(--t1)'}}>Новое желание ＋</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>

            <input className="inp" placeholder="Ссылка на товар" value={url} onChange={e=>setUrl(e.target.value)} />
            <textarea className="txta" rows="2" placeholder="Цвет, размер, нюансы…" value={note} onChange={e=>setNote(e.target.value)} />
            <input type="file" accept="image/*" className="inp" style={{fontSize:12}} onChange={handleFile} />
            {imgLoad&&<div className="note">Сжимается…</div>}
            {imgErr&&<div className="err">{imgErr}</div>}
            {img&&!imgLoad&&<img src={img} alt="" style={{borderRadius:12,maxHeight:130,width:'100%',objectFit:'cover'}} />}
            {error&&<div className="err">{error}</div>}
            <div style={{display:'flex',gap:8,marginTop:4}}>
              <button className="btn btn-g" style={{flex:1}} onClick={()=>{reset();onClose();}}>Отмена</button>
              <button className="btn btn-p" style={{flex:2}} onClick={submit} disabled={!title.trim()||disabled}>Добавить ✓</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  const THEMES = [
    { id:'forest',  label:'Лесная',   g1:'#5a7a38', g2:'#7ea858', bg:'#0f110d', s1:'#181c15' },
    { id:'ocean',   label:'Океан',    g1:'#1a6090', g2:'#2890c8', bg:'#0a0c10', s1:'#12161e' },
    { id:'amber',   label:'Янтарь',   g1:'#8a5a10', g2:'#c8820a', bg:'#100d08', s1:'#1a1510' },
    { id:'rose',    label:'Роза',     g1:'#8a3050', g2:'#c05878', bg:'#100a0d', s1:'#1a1015' },

  function ProfileTab({ userName, authUid, myWishes, myClaims, claims, items, onLogout, onUnclaim, onImgClick }) {
    const [photo, setPhoto]       = useState(loadLocal('profile:photo:'+userName, ''));
    const [showPin, setShowPin]   = useState(false);
    const [oldPin, setOldPin]     = useState('');
    const [newPin, setNewPin]     = useState('');
    const [newPin2, setNewPin2]   = useState('');
    const [pinMsg, setPinMsg]     = useState('');
    const [pinErr, setPinErr]     = useState('');
    const [pinLoad, setPinLoad]   = useState(false);
    const [theme, setTheme]       = useState(loadLocal('profile:theme', 'forest'));
    const [showClaims, setShowClaims] = useState(false);

    const [c1, c2] = nameColor(userName);

    // Применяем тему к CSS переменным
    useEffect(()=>{
      const t = THEMES.find(t=>t.id===theme) || THEMES[0];
      const root = document.documentElement;
      root.style.setProperty('--g1', t.g1);
      root.style.setProperty('--g2', t.g2);
      saveLocal('profile:theme', theme);
    }, [theme]);

    const handlePhoto = async e => {
      const f = e.target.files?.[0]; if(!f) return;
      try {
        const compressed = await compressImage(f);
        setPhoto(compressed);
        saveLocal('profile:photo:'+userName, compressed);
      } catch(err) { console.error(err); }
    };

    const handleChangePin = async () => {
      if(!oldPin){setPinErr('Введите старый PIN.');return;}
      if(newPin.length<4){setPinErr('Новый PIN минимум 4 цифры.');return;}
      if(newPin!==newPin2){setPinErr('Новые PIN-коды не совпадают.');return;}
      setPinLoad(true); setPinErr(''); setPinMsg('');
      try {
        const oldHash = await hashPin(oldPin);
        const newHash = await hashPin(newPin);
        const ref = usersCol().doc(userName);
        await db.runTransaction(async tx => {
          const snap = await tx.get(ref);
          if(!snap.exists) throw new Error('no-user');
          if(snap.data().pinHash !== oldHash) throw new Error('wrong-pin');
          tx.update(ref, {pinHash: newHash});
        });
        // Обновляем разрешение для нового PIN
        saveLocal('nywish:pin_ok', userName);
        setPinMsg('PIN успешно изменён ✓');
        setOldPin(''); setNewPin(''); setNewPin2('');
        setTimeout(()=>setShowPin(false), 1500);
      } catch(e) {
        if(e.message==='wrong-pin') setPinErr('Старый PIN неверный.');
        else setPinErr('Не удалось изменить PIN. Попробуйте ещё раз.');
      }
      setPinLoad(false);
    };

    // Мои активные брони
    const myClaimsList = useMemo(()=>{
      return Object.entries(claims)
        .filter(([,c])=>c.claimerUid===authUid)
        .map(([id])=>items.find(i=>i.id===id))
        .filter(Boolean);
    }, [claims, items, authUid]);

    return (
      <div className="screen fu">
        <div className="page-header"><div className="page-title">Профиль</div></div>

        {/* ── АВАТАР + ИМЯ ── */}
        <div className="card" style={{marginBottom:10,textAlign:'center',paddingTop:24,paddingBottom:20}}>
          <div style={{position:'relative',display:'inline-block',marginBottom:14}}>
            <div style={{
              width:88,height:88,borderRadius:26,overflow:'hidden',
              background:photo?'transparent':`linear-gradient(135deg,${c1},${c2})`,
              boxShadow:`0 6px 24px ${c1}55`,
              display:'flex',alignItems:'center',justifyContent:'center',
              fontFamily:"'Unbounded',sans-serif",fontSize:28,fontWeight:700,color:'white',
            }}>
              {photo
                ? <img src={photo} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}} />
                : userName.slice(0,2).toUpperCase()
              }
            </div>
            {/* Кнопка смены фото */}
            <label style={{
              position:'absolute',bottom:-6,right:-6,
              width:28,height:28,borderRadius:'50%',
              background:'var(--s2)',border:'2px solid var(--bg)',
              display:'flex',alignItems:'center',justifyContent:'center',
              cursor:'pointer',fontSize:13,
            }}>
              📷
              <input type="file" accept="image/*" style={{display:'none'}} onChange={handlePhoto} />
            </label>
          </div>
          <div style={{fontFamily:"'Unbounded',sans-serif",fontSize:18,fontWeight:700,color:'var(--t1)',marginBottom:4}}>{userName}</div>

          {/* Статы */}
          <div style={{display:'flex',justifyContent:'center',gap:24,marginTop:12}}>
            {[
              {val:myWishes.length, label:'желаний'},
              {val:myClaims, label:'брон'+( myClaims===1?'ь':myClaims<5?'и':'ей')},
            ].map(({val,label})=>(
              <div key={label} style={{textAlign:'center'}}>
                <div style={{fontFamily:"'Unbounded',sans-serif",fontSize:22,fontWeight:700,
                  background:`linear-gradient(135deg,${c1},${c2})`,WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>{val}</div>
                <div className="note" style={{fontSize:11}}>{label}</div>
              </div>
            ))}
          </div>
        </div>

        {/* ── МОИ БРОНИ ── */}
        <div className="card" style={{marginBottom:10}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}} onClick={()=>setShowClaims(s=>!s)}>
            <div style={{fontWeight:600,color:'var(--t1)',fontSize:14}}>🎁 Я дарю</div>
            <div style={{fontSize:12,color:'var(--t2)'}}>{myClaims} подарк{myClaims===1?'':myClaims<5?'а':'ов'} {showClaims?'▲':'▼'}</div>
          </div>
          {showClaims && (
            <div style={{marginTop:12,display:'grid',gap:8}}>
              {myClaimsList.length===0&&<div className="note">Вы пока ничего не бронировали.</div>}
              {myClaimsList.map(w=>(
                <div key={w.id} style={{background:'var(--s2)',borderRadius:14,padding:'10px 12px',display:'flex',alignItems:'flex-start',gap:10}}>
                  {w.image&&<img src={w.image} alt="" style={{width:40,height:40,borderRadius:8,objectFit:'cover',cursor:'pointer',flexShrink:0}} onClick={()=>onImgClick(w.image)} />}
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600,fontSize:13,color:'var(--t1)',marginBottom:2}}>{w.title}</div>
                    <div className="note" style={{fontSize:11}}>Для: {w.ownerName}</div>
                  </div>
                  <button className="btn btn-d" style={{fontSize:11,padding:'5px 10px',flexShrink:0}}
                    onClick={()=>onUnclaim(w)}>Снять</button>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* ── ЦВЕТОВАЯ ТЕМА ── */}
        <div className="card" style={{marginBottom:10}}>
          <div style={{fontWeight:600,color:'var(--t1)',fontSize:14,marginBottom:12}}>🎨 Цветовая тема</div>
          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>

                display:'flex',flexDirection:'column',alignItems:'center',gap:5,cursor:'pointer',

                  width:44,height:44,borderRadius:14,
                  background:`linear-gradient(135deg,${t.g1},${t.g2})`,
                  border:theme===t.id?`2px solid ${t.g2}`:'2px solid transparent',
                  boxShadow:theme===t.id?`0 0 0 2px ${t.g1}55`:'none',
                  transition:'all .2s',
                }}/>
                <div style={{fontSize:10,color:theme===t.id?'var(--t1)':'var(--t2)',fontWeight:theme===t.id?600:400}}>{t.label}</div>
              </div>
            ))}
          </div>
        </div>

        {/* ── СМЕНА PIN ── */}
        <div className="card" style={{marginBottom:10}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}} onClick={()=>{setShowPin(s=>!s);setPinErr('');setPinMsg('');}}>
            <div style={{fontWeight:600,color:'var(--t1)',fontSize:14}}>🔑 Изменить PIN</div>
            <div style={{fontSize:12,color:'var(--t2)'}}>{showPin?'▲':'▼'}</div>
          </div>
          {showPin&&(
            <div style={{marginTop:12,display:'flex',flexDirection:'column',gap:8}}>
              <input className="inp" type="password" inputMode="numeric" placeholder="Старый PIN" value={oldPin}
                onChange={e=>{setOldPin(e.target.value.replace(/\D/g,''));setPinErr('');}} maxLength={8} />
              <input className="inp" type="password" inputMode="numeric" placeholder="Новый PIN (мин. 4 цифры)" value={newPin}
                onChange={e=>{setNewPin(e.target.value.replace(/\D/g,''));setPinErr('');}} maxLength={8} />
              <input className="inp" type="password" inputMode="numeric" placeholder="Повторите новый PIN" value={newPin2}
                onChange={e=>{setNewPin2(e.target.value.replace(/\D/g,''));setPinErr('');}} maxLength={8} />
              {pinErr&&<div className="err">{pinErr}</div>}
              {pinMsg&&<div style={{color:'#9aba70',fontSize:13}}>{pinMsg}</div>}
              <button className="btn btn-p" style={{fontSize:13}} onClick={handleChangePin} disabled={!oldPin||newPin.length<4||!newPin2||pinLoad}>

        {/* ── ВЫХОД ── */}
        <div className="card" style={{marginBottom:10}}>
          <div className="note" style={{marginBottom:12,fontSize:12,lineHeight:1.5}}>
            🔒 PIN защищает ваш профиль. Используйте один PIN на всех устройствах.
          </div>
          <button className="btn btn-d" style={{width:'100%',fontSize:13}} onClick={onLogout}>Выйти из аккаунта</button>
        </div>

        <div style={{fontSize:11,color:'var(--t2)',textAlign:'center',marginTop:8,marginBottom:8,lineHeight:1.6}}>
          🛡️ 23 февраля · 🌷 8 марта · 🎄 Новый год<br/>Семейный вишлист подарков<br/>
          <span style={{fontSize:10,opacity:.5,userSelect:'all'}}>uid: {authUid}</span>
        </div>
      </div>
    );
  }

  // ══════════════════════════════════════
  // MAIN APP
  // ══════════════════════════════════════
  function App() {
    const savedName = loadLocal('nywish:name','');
    const pinOk     = loadLocal('nywish:pin_ok','');
    const isAuthed  = savedName && pinOk === savedName;

    const [authDone, setAuthDone] = useState(isAuthed);
    const [userName, setUserName] = useState(isAuthed ? savedName : '');
    const [authUid, setAuthUid]   = useState(null);
    const [tab, setTab]           = useState('my'); // people | my | feed | profile
    const [items, setItems]       = useState([]);
    const [claims, setClaims]     = useState({});
    const [loading, setLoading]   = useState(true);
    const [addError, setAddError] = useState('');
    const [claimError, setClaimError] = useState('');
    const [previewImage, setPreviewImage] = useState(null);
    const [showAdd, setShowAdd]   = useState(false);
    const [openPerson, setOpenPerson] = useState(null); // имя или null
    const [feedFilter, setFeedFilter] = useState('all');

    useEffect(()=>{ const u=auth.onAuthStateChanged(u=>setAuthUid(u?.uid||null)); return u; },[]);
    useEffect(()=>{ if(userName) saveLocal('nywish:name',userName); },[userName]);

    useEffect(()=>{
      if(!authDone) return;
      setLoading(true);
      const u=itemsCol().orderBy('createdAt','desc').onSnapshot(snap=>{
        const a=[];snap.forEach(d=>a.push({id:d.id,...d.data()}));
        setItems(a);setLoading(false);
      },err=>{console.error(err);setLoading(false);});
      return u;
    },[authDone]);

    useEffect(()=>{
      if(!authDone) return;
      const u=claimsCol().onSnapshot(snap=>{const m={};snap.forEach(d=>m[d.id]=d.data());setClaims(m);},
        err=>{console.error(err);setClaims({});});
      return u;
    },[authDone]);

    const myWishes    = useMemo(()=>items.filter(i=>i.addedByUid===authUid),[items,authUid]);

    const THREE_MONTHS = 90 * 24 * 60 * 60 * 1000;
    // Желания которые надо проверить: старше 3 месяцев И не отложены (snooze)
    const snoozedRaw = useMemo(()=>loadLocal('nywish:snoozed:'+userName,[]),[userName,items]);
    // Фильтруем только те у кого срок отсрочки не истёк
    const snoozedIds = useMemo(()=>snoozedRaw
      .filter(s=>s?.until && Date.now() < s.until)
      .map(s=>s.id)
    ,[snoozedRaw]);
    const staleWishes = useMemo(()=>myWishes.filter(w=>{
      if(!w.createdAt) return false;
      const age = Date.now() - w.createdAt;
      return age > THREE_MONTHS && !snoozedIds.includes(w.id);
    }),[myWishes,snoozedIds]);
    const freshWishes = useMemo(()=>myWishes.filter(w=>!staleWishes.find(s=>s.id===w.id)),[myWishes,staleWishes]);

    // «Всё ещё хочу» — откладываем напоминание ещё на 3 месяца
    const handleSnoozeWish = (id) => {
      const snoozed = loadLocal('nywish:snoozed:'+userName,[]);
      // Сохраняем id + время когда отложили
      const next = [...snoozed.filter(s=>s!==id&&s?.id!==id), {id, until: Date.now()+THREE_MONTHS}];
      saveLocal('nywish:snoozed:'+userName, next);
      // Принудительно обновляем список — пересчитываем
      setItems(prev=>[...prev]);
    };
    const othersWishes= useMemo(()=>items.filter(i=>i.addedByUid!==authUid),[items,authUid]);
    const peopleData  = useMemo(()=>{
      const map={};
      items.forEach(i=>{if(!i.ownerName)return;map[i.ownerName]=(map[i.ownerName]||0)+1;});
      return Object.entries(map).map(([name,count])=>({name,count})).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
    },[items]);

    const feedNames   = useMemo(()=>{const s=new Set();othersWishes.forEach(w=>w.ownerName&&s.add(w.ownerName));return Array.from(s);},[othersWishes]);
    const feedItems   = useMemo(()=>{
      let arr = feedFilter==='my_claims' ? items.filter(w=>claims[w.id]?.claimerUid===authUid)
              : feedFilter!=='all' ? items.filter(w=>w.ownerName===feedFilter)
              : othersWishes;
      return arr.slice().sort((a,b)=>{const ac=!!claims[a.id],bc=!!claims[b.id];return ac===bc?0:ac?1:-1;});
    },[feedFilter,othersWishes,items,claims,authUid]);

    const handleAdd = async ({title,url,note,image}) => {
      setAddError('');
      if(!userName.trim()){setAddError('Войдите сначала.');return;}
      try{await itemsCol().add({title,url,note,image:image||null,ownerName:userName.trim(),addedByUid:authUid,createdAt:Date.now()});}
      catch(e){console.error(e);setAddError('Не удалось добавить.');}
    };
    const handleUpdate=async(id,u)=>{try{await itemsCol().doc(id).update(u);}catch(e){console.error(e);}};
    const handleDelete=async id=>{try{await itemsCol().doc(id).delete();}catch(e){console.error(e);}};

    const handleClaim = async wish => {
      setClaimError('');
      if(!userName.trim()){setClaimError('Войдите сначала.');return;}
      if(wish.addedByUid===authUid){setClaimError('Нельзя бронировать своё желание.');return;}
      const ref=claimsCol().doc(wish.id);
      try{await db.runTransaction(async tx=>{const s=await tx.get(ref);if(s.exists)throw new Error('taken');tx.set(ref,{claimerUid:authUid,claimerName:userName.trim(),createdAt:Date.now()});});}
      catch(e){setClaimError(e.message==='taken'?'Уже забронировано.':'Не удалось забронировать.');}
    };
    const handleUnclaim = async wish => {
      setClaimError('');
      if(!window.confirm('Снять бронь?'))return;
      const ref=claimsCol().doc(wish.id);
      try{await db.runTransaction(async tx=>{const s=await tx.get(ref);if(!s.exists)throw new Error();if(s.data().claimerUid!==authUid)throw new Error('not-owner');tx.delete(ref);});}
      catch(e){setClaimError(e.message==='not-owner'?'Только вы можете снять свою бронь.':'Не удалось снять бронь.');}
    };

    const handleLogout = () => {
      saveLocal('nywish:pin_ok','');
      setAuthDone(false); setUserName(''); setTab('my');
    };

    if(!authDone) return <AuthScreen onAuth={name=>{setUserName(name);setAuthDone(true);}}/>;

    const myClaims = Object.entries(claims).filter(([,c])=>c.claimerUid===authUid).length;

    return (
      <div className="app">
        {/* ── ЛЮДИ ── */}
        {tab==='people' && (
          <div className="screen fu">
            <div className="page-header">
              <div>
                <div className="page-title">Вишлисты</div>
                <div className="note" style={{fontSize:11,marginTop:3}}>Нажмите на человека чтобы подарить 🎁</div>
              </div>
            </div>
            {loading&&<p className="note">Загружается…</p>}
            {!loading&&peopleData.length===0&&<p className="note">Пока никто не добавил желания.</p>}
            {peopleData.map(({name,count})=>{
              const [c1,c2]=nameColor(name);
              const myClaimsForPerson = Object.values(claims).filter(c=>c.claimerUid===authUid&&items.find(i=>i.id===Object.keys(claims).find(k=>claims[k]===c)&&i.ownerName===name)).length;
              return (
                <div className="person-card" key={name} onClick={()=>setOpenPerson(name)}>
                  <div className="avatar" style={{width:46,height:46,fontSize:14,background:`linear-gradient(135deg,${c1},${c2})`,boxShadow:`0 3px 12px ${c1}44`}}>
                    {name.slice(0,2).toUpperCase()}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600,fontSize:15,color:'var(--t1)',marginBottom:2}}>{name}</div>
                    <div className="note" style={{fontSize:11}}>{count} {count===1?'желание':count<5?'желания':'желаний'}</div>
                  </div>
                  <div style={{fontSize:18,color:'var(--t2)'}}>›</div>
                </div>
              );
            })}
          </div>
        )}

        {/* ── МОЁ ── */}
        {tab==='my' && (
          <div className="screen fu">
            <div className="page-header">
              <div className="page-title">Мои<br/>желания</div>
            </div>

            {/* Устаревшие желания — напоминание */}
            {staleWishes.length>0&&(
              <div style={{marginBottom:16}}>
                <div style={{
                  background:'linear-gradient(135deg,rgba(200,169,110,0.12),rgba(200,120,50,0.08))',
                  border:'1px solid rgba(200,169,110,0.3)',
                  borderRadius:18,padding:'14px 16px',marginBottom:10,
                }}>
                  <div style={{display:'flex',gap:10,alignItems:'flex-start',marginBottom:10}}>
                    <div style={{fontSize:22,flexShrink:0}}>⏰</div>
                    <div>
                      <div style={{fontWeight:700,color:'var(--gold)',fontSize:14,marginBottom:3}}>Проверьте старые желания</div>
                      <div style={{fontSize:12,color:'rgba(200,169,110,0.7)',lineHeight:1.4}}>
                        {staleWishes.length} {staleWishes.length===1?'желание уже':'желания уже'} больше 3 месяцев — актуально ещё?
                      </div>
                    </div>
                  </div>
                  <div style={{display:'grid',gap:8}}>
                    {staleWishes.map(w=>(
                      <div key={w.id} style={{background:'rgba(0,0,0,0.2)',borderRadius:14,padding:'12px 14px'}}>
                        <div style={{fontWeight:600,fontSize:14,color:'var(--t1)',marginBottom:3}}>{w.title}</div>
                        {w.note&&<div style={{fontSize:12,color:'var(--t2)',marginBottom:3}}>{w.note}</div>}
                        <div style={{fontSize:11,color:'rgba(200,169,110,0.6)',marginBottom:10}}>
                          Добавлено {new Date(w.createdAt).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}
                        </div>
                        <div style={{display:'flex',gap:8}}>
                          <button className="btn btn-g" style={{flex:1,fontSize:12,padding:'8px 12px'}}
                            onClick={()=>handleSnoozeWish(w.id)}>
                            ✓ Всё ещё хочу
                          </button>
                          <button className="btn btn-d" style={{flex:1,fontSize:12,padding:'8px 12px'}}
                            onClick={()=>handleDelete(w.id)}>
                            🎁 Уже подарили
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {myWishes.length===0&&!loading&&(
              <div style={{textAlign:'center',padding:'32px 0 16px'}}>
                <div style={{fontSize:44,marginBottom:12}}>🌟</div>
                <div className="note">Добавьте первое желание — нажмите ＋</div>
              </div>
            )}
            <div style={{display:'grid',gap:8}}>
              {freshWishes.map(w=><WishCardMy key={w.id} wish={w} locked={!!claims[w.id]} onDelete={handleDelete} onUpdate={handleUpdate} onImgClick={setPreviewImage} />)}
            </div>
          </div>
        )}

        {/* ── ЛЕНТА ── */}
        {tab==='feed' && (
          <div className="screen fu">
            <div className="page-header">
              <div className="page-title">Лента</div>
            </div>
            <div style={{display:'flex',gap:6,overflowX:'auto',paddingBottom:8,marginBottom:8,WebkitOverflowScrolling:'touch'}}>
              {[['all','Все'],['my_claims','Мои брони'],...feedNames.map(n=>[n,n])].map(([val,label])=>(
                <button key={val} onClick={()=>setFeedFilter(val)} style={{
                  flexShrink:0,borderRadius:999,padding:'5px 12px',fontSize:12,fontWeight:600,border:'none',cursor:'pointer',
                  background:feedFilter===val?`linear-gradient(135deg,var(--g1),var(--g2))`:'var(--s2)',
                  color:feedFilter===val?'var(--t1)':'var(--t2)',
                  boxShadow:feedFilter===val?'0 3px 12px rgba(90,122,56,.3)':'none',
                }}>{label}</button>
              ))}
            </div>
            {claimError&&<div className="err" style={{marginBottom:10}}>{claimError}</div>}
            {feedItems.length===0&&!loading&&<p className="note">Пусто.</p>}
            <div style={{display:'grid',gap:8}}>
              {feedItems.map(w=>(
                <div key={w.id}>
                  {feedFilter==='all'&&<div style={{fontSize:10,fontWeight:700,color:'var(--gold)',marginBottom:4,letterSpacing:'.06em',textTransform:'uppercase'}}>{w.ownerName}</div>}
                  <WishCardGuest wish={w} claim={claims[w.id]} userName={userName} authUid={authUid}
                    onClaim={()=>handleClaim(w)} onUnclaim={()=>handleUnclaim(w)} onImgClick={setPreviewImage} />
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ── ПРОФИЛЬ ── */}
        {tab==='profile' && (
          <ProfileTab
            userName={userName} authUid={authUid}
            myWishes={myWishes} myClaims={myClaims}
            claims={claims} items={items}
            onLogout={handleLogout}
            onUnclaim={handleUnclaim}
            onImgClick={setPreviewImage}
          />
        )}

        {/* ── FAB ── */}
        {(tab==='my'||tab==='feed') && (
          <button className="fab" onClick={()=>setShowAdd(true)}>＋</button>
        )}

        {/* ── BOTTOM NAV ── */}
        <nav className="bottom-nav">
          {[
            {id:'people', icon:'👥', label:'Люди'},
            {id:'my',     icon:'🎁', label:'Моё'},
            {id:'feed',   icon:'🔍', label:'Лента'},
            {id:'profile',icon:'👤', label:'Профиль'},
          ].map(({id,icon,label})=>(
            <div key={id} className={`nav-item ${tab===id?'on':''}`} onClick={()=>setTab(id)}>
              {tab===id&&<div className="nav-dot"/>}
              <div className="nav-icon">{icon}</div>
              <div className="nav-label">{label}</div>
            </div>
          ))}
        </nav>

        {/* ── ADD SHEET ── */}
        <AddWishSheet open={showAdd} onClose={()=>setShowAdd(false)} onAdd={handleAdd} disabled={!authUid} error={addError} />

        {/* ── PERSON OVERLAY ── */}
        <PersonOverlay
          name={openPerson||''} open={!!openPerson}
          onClose={()=>{setOpenPerson(null);setClaimError('');}}
          items={items} claims={claims}
          userName={userName} authUid={authUid}
          onClaim={handleClaim} onUnclaim={handleUnclaim}
          onImgClick={setPreviewImage} claimError={claimError}
        />

        {/* ── IMAGE PREVIEW ── */}
        {previewImage&&(
          <div className="img-overlay" onClick={()=>setPreviewImage(null)}>
            <div style={{position:'relative'}} onClick={e=>e.stopPropagation()}>
              <button style={{position:'absolute',top:-10,right:-10,width:30,height:30,borderRadius:'50%',background:'var(--s1)',border:'1px solid var(--b2)',cursor:'pointer',color:'var(--t1)',fontSize:13,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={()=>setPreviewImage(null)}>✕</button>
              <img src={previewImage} alt="" style={{maxHeight:'85vh',maxWidth:'88vw',borderRadius:18,boxShadow:'0 30px 80px rgba(0,0,0,.7)'}} />
            </div>
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
